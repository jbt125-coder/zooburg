<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07021a">
<title>Zooburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#07021a}
body{font-family:'Press Start 2P','Courier New',monospace;color:#f4ecff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);touch-action:none;-webkit-text-size-adjust:100%}
html.zoomed,html.zoomed body,html.zoomed canvas,html.zoomed .screen{touch-action:pinch-zoom pan-x pan-y}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.screen{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.dim{background:rgba(7,2,26,0.84)}
/* centre when it fits, scroll from the top when it doesn't */
.screen{justify-content:flex-start}
.screen::before{content:'';margin-top:auto}
.screen::after{content:'';margin-bottom:auto}
.title{font-size:clamp(30px,11vw,72px);letter-spacing:2px;margin:0 0 4px;line-height:1.1;font-weight:normal}
.title span{display:inline-block;text-shadow:0 0 6px currentColor,0 0 18px currentColor,3px 3px 0 #2a0a48}
.tag{font-size:10px;color:#b9a6ff;margin:10px 0 16px;line-height:1.8}
.lineup{display:flex;justify-content:center;margin:4px 0 14px}
.lineup img{width:56px;height:56px;margin:0 6px;image-rendering:pixelated;animation:bob 0.6s steps(2) infinite alternate}
.lineup img:nth-child(2){animation-delay:0.15s}
.lineup img:nth-child(3){animation-delay:0.3s}
.lineup img:nth-child(4){animation-delay:0.45s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.btn{font-family:inherit;font-size:12px;color:#fff;background:#160733;border:3px solid #29f3ff;box-shadow:0 0 12px #29f3ff,inset 0 0 10px rgba(41,243,255,0.35);border-radius:4px;padding:14px 16px;margin:7px;min-width:230px;cursor:pointer;line-height:1.5}
.btn small{display:block;font-size:8px;color:#b9a6ff;margin-top:6px}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
.btns{display:flex;flex-wrap:wrap;justify-content:center}
.pair{display:flex;justify-content:center;width:100%;max-width:290px}
.pair .btn{min-width:0;flex:1;margin:7px 4px;padding:14px 6px;font-size:10px}
.flipmsg{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18px);transform:rotate(180deg);font-size:16px;line-height:1.6;text-align:center;display:none}
.hint{font-size:8px;color:#8f7fd0;line-height:2.1;max-width:520px;margin-top:14px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;max-width:640px;align-items:flex-start}
.card{font-family:inherit;color:#fff;background:#140832;border:3px solid #ffffff;border-radius:6px;padding:8px 6px;width:104px;margin:5px;cursor:pointer;position:relative;vertical-align:top}
.card img{width:72px;height:72px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.card.locked{border-color:#3a2f66;box-shadow:none;cursor:default;background:#0e0526}
.card.locked .nm{color:#5a4a90}
.card .sk{font-size:6px;line-height:1.5;color:#ffd23f;margin-top:5px}
.card.locked .sk{color:#5a4a90}
.card .req{font-size:7px;line-height:1.6;color:#b9a6ff;margin-top:6px}
.card .req.prog{color:#ffd23f;margin-top:4px}
.card .new.nxt{background:#29f3ff;animation:none}
.card .new{position:absolute;top:6px;right:6px;font-size:7px;padding:3px 4px;background:#ffd23f;color:#07021a;animation:blink 0.8s steps(2) infinite}
.unl{display:flex;align-items:center;gap:12px;margin:10px auto 6px;padding:10px 14px;border:3px solid #fff;border-radius:6px;background:#140832;font-size:10px;line-height:1.8;text-align:left;max-width:300px}
.unl img{width:56px;height:56px;image-rendering:pixelated}
#toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:8px 14px;font-size:10px;color:#fff;background:#140832;border:3px solid #fff;border-radius:6px;white-space:nowrap;pointer-events:none}
#toast img{width:32px;height:32px;image-rendering:pixelated}
.card .nm{font-size:10px}
.card .who{position:absolute;top:6px;left:6px;font-size:8px;padding:3px 4px;background:#ffffff;color:#07021a}
h2{font-size:13px;margin:0 0 16px;line-height:1.7;font-weight:normal}
.spb{position:fixed;z-index:6;width:76px;height:76px;border-radius:50%;background:#160733;border:3px solid #ffd23f;box-shadow:0 0 16px #ffd23f;padding:0;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;color:#ffd23f;touch-action:none;animation:sppulse 1s ease-in-out infinite alternate}
.spb img{width:40px;height:40px;image-rendering:pixelated;pointer-events:none}
.spb.sm{width:60px;height:60px}
.spb.sm img{width:30px;height:30px}
.spb span{font-size:7px;margin-top:2px;pointer-events:none}
.spb.used{border-color:#3a2f66;box-shadow:none;color:#5a4a90;animation:none}
.spb.used img{opacity:0.3;filter:grayscale(1)}
@keyframes sppulse{from{box-shadow:0 0 8px #ffd23f}to{box-shadow:0 0 22px #ffd23f}}
#pauseBtn{position:fixed;z-index:6;width:40px;height:40px;font-family:inherit;font-size:11px;color:#fff;background:#160733;border:2px solid #ff3cf0;border-radius:4px;box-shadow:0 0 10px #ff3cf0;padding:0}
.pad{position:fixed;z-index:5;border-radius:50%;background:#12062e;border:3px solid #ff3cf0;opacity:0.9;touch-action:none}
.cross{position:absolute;left:13%;top:13%;width:74%;height:74%;transform:rotate(45deg);-webkit-transform:rotate(45deg);pointer-events:none}
.arm{position:absolute;width:34%;height:34%;background:#2b1660;border:2px solid #8a6cff;border-radius:6px}
.a-up{left:33%;top:0}.a-down{left:33%;bottom:0}.a-left{left:0;top:33%}.a-right{right:0;top:33%}
.hub{position:absolute;left:33%;top:33%;width:34%;height:34%;background:#2b1660}
.arm:after{content:'';position:absolute;left:50%;top:50%;width:0;height:0;border:6px solid transparent}
.a-up:after{border-bottom-color:#ffffff;margin:-12px 0 0 -6px}
.a-down:after{border-top-color:#ffffff;margin:0 0 0 -6px}
.a-left:after{border-right-color:#ffffff;margin:-6px 0 0 -12px}
.a-right:after{border-left-color:#ffffff;margin:-6px 0 0 0}
#menu{padding-top:calc(env(safe-area-inset-top,0px) + 62px)}
#cogBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:44px;height:44px;padding:6px;background:#160733;border:2px solid #29f3ff;border-radius:4px;box-shadow:0 0 10px #29f3ff;cursor:pointer;color:#29f3ff}
#cogBtn svg{width:100%;height:100%;display:block}
.lbtabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:360px;margin-bottom:10px}
.chip{font-family:inherit;font-size:7px;color:#b9a6ff;background:#160733;border:2px solid #3a2f66;border-radius:12px;padding:6px 8px;cursor:pointer}
.chip.on{color:#07021a;background:#ffd23f;border-color:#ffd23f}
.lblist{width:100%;max-width:360px;margin-bottom:8px}
.lbrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #2b1660;text-align:left}
.lbrow .rk{width:22px;font-size:10px;color:#ffd23f}
.lbrow .nm2{flex:1;font-size:10px;line-height:1.4;min-width:0}
.lbrow .nm2 small{display:block;font-size:6px;color:#b9a6ff;margin-top:3px}
.lbrow .sc{font-size:11px;color:#ffffff}
.lbform{display:flex;flex-direction:column;align-items:center;margin:4px 0 6px}
#lbName{font-family:inherit;font-size:16px;text-transform:uppercase;width:210px;padding:10px;text-align:center;color:#fff;background:#07021a;border:3px solid #ffd23f;border-radius:4px;-webkit-user-select:text;user-select:text}
.btn.lbsave{min-width:140px;padding:10px;margin-top:8px}
.setbox{width:100%;max-width:300px;margin:0 auto 10px;text-align:left}
.setrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.setlbl{font-size:11px}
.tog{font-family:inherit;font-size:10px;width:64px;padding:8px 0;color:#07021a;background:#3cff8a;border:2px solid #3cff8a;border-radius:4px;box-shadow:0 0 8px #3cff8a;cursor:pointer}
.tog[aria-pressed="false"]{color:#b9a6ff;background:#160733;border-color:#5a4a90;box-shadow:none}
.volrow{display:flex;align-items:center;gap:10px}
.volrow input{flex:1;min-width:0;height:32px;accent-color:#29f3ff;touch-action:none;margin:0}
.volrow input:disabled{opacity:0.4}
.volrow span{font-size:9px;width:40px;text-align:right;color:#b9a6ff}
.snd-hint{font-size:9px;color:#ffd23f;margin:-6px 0 10px;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0.25}}
@media (prefers-reduced-motion: reduce){.snd-hint{animation:none}.lineup img{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>

<div id="menu" class="screen" style="display:none">
  <button id="cogBtn" aria-label="Sound settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10 1h4l.6 3.1 1.9.8 2.6-1.8 2.8 2.8-1.8 2.6.8 1.9L23 10v4l-3.1.6-.8 1.9 1.8 2.6-2.8 2.8-2.6-1.8-1.9.8L14 23h-4l-.6-3.1-1.9-.8-2.6 1.8-2.8-2.8 1.8-2.6-.8-1.9L1 14v-4l3.1-.6.8-1.9-1.8-2.6 2.8-2.8 2.6 1.8 1.9-.8zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></button>
  <h1 class="title" aria-label="Zooburg"><span style="color:#ff3cf0">Z</span><span style="color:#ffd23f">O</span><span style="color:#29f3ff">O</span><span style="color:#3cff8a">B</span><span style="color:#ff9a1f">U</span><span style="color:#c46bff">R</span><span style="color:#ff3cf0">G</span></h1>
  <div class="tag">Hop the cubes. Paint the zoo. Steal the bridge.</div>
  <div id="sndHint" class="snd-hint" style="visibility:hidden">Tap anywhere for sound</div>
  <div class="lineup" id="lineup"></div>
  <div class="btns">
    <div class="pair">
      <button class="btn" data-mode="pyramid" data-sp="0" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">1P Original<small>Classic pyramid</small></button>
      <button class="btn" data-mode="pyramid" data-sp="1" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">1P Special<small>Pyramid + specials</small></button>
    </div>
    <button class="btn" data-mode="cpu">Versus CPU<small>1 player, landscape</small></button>
    <button class="btn" data-mode="cpux" style="border-color:#3cff8a;box-shadow:0 0 12px #3cff8a">Vs. CPU experimental<small>1 player, portrait</small></button>
    <div class="pair">
      <button class="btn" data-mode="2p" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">2 players<small>Side by side</small></button>
      <button class="btn" data-mode="h2h" style="border-color:#ff9a1f;box-shadow:0 0 12px #ff9a1f">Head to head<small>Phone flat, face to face</small></button>
    </div>
    <button class="btn" id="btnScores" style="border-color:#ffffff;box-shadow:0 0 12px #ffffff;padding:10px 16px">High scores</button>
  </div>
  <div class="hint">The D-pad is turned 45&deg; like the arcade stick, so up hops up-right. Pizza boxes fly you back to the top. Keyboard: WASD and arrow keys.</div>
</div>

<div id="select" class="screen" style="display:none">
  <h2 id="selHead"></h2>
  <div class="cards" id="cards"></div>
  <div class="btns"><button class="btn" id="selBack" style="min-width:140px">Back</button></div>
</div>

<div id="over" class="screen dim" style="display:none">
  <div id="overFlip" class="flipmsg"></div>
  <div id="overBody"></div>
  <div class="btns">
    <button class="btn" id="btnRematch" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">Rematch</button>
    <button class="btn" id="btnAnimals">Change animals</button>
    <button class="btn" id="btnMenu" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">Main menu</button>
  </div>
</div>

<div id="pause" class="screen dim" style="display:none">
  <h2>Paused</h2>
  <div class="btns">
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn" id="btnSettings" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">Sound settings</button>
    <button class="btn" id="btnQuit" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">Main menu</button>
  </div>
</div>

<div id="scores" class="screen dim" style="display:none">
  <h2>High scores</h2>
  <div class="lbtabs" id="lbTabs"></div>
  <div class="lblist" id="lbList"></div>
  <div class="btns"><button class="btn" id="lbBack">Back</button></div>
</div>

<div id="settings" class="screen dim" style="display:none">
  <h2>Sound settings</h2>
  <div class="setbox">
    <div class="setrow"><span class="setlbl" id="lblMusic">Music</span><button class="tog" id="togMusic" aria-labelledby="lblMusic">ON</button></div>
    <div class="volrow"><input type="range" id="volMusic" min="0" max="100" step="5" aria-label="Music volume"><span id="valMusic"></span></div>
    <div class="setrow"><span class="setlbl" id="lblSfx">Sound FX</span><button class="tog" id="togSfx" aria-labelledby="lblSfx">ON</button></div>
    <div class="volrow"><input type="range" id="volSfx" min="0" max="100" step="5" aria-label="Sound effects volume"><span id="valSfx"></span></div>
    <div class="setrow"><span class="setlbl" id="lblVoice">Voices</span><button class="tog" id="togVoice" aria-labelledby="lblVoice">ON</button></div>
    <div class="volrow"><input type="range" id="volVoice" min="0" max="100" step="5" aria-label="Voices volume"><span id="valVoice"></span></div>
  </div>
  <div class="btns"><button class="btn" id="setBack">Back</button></div>
</div>

<div id="toast" role="status"></div>
<button id="spBtn" class="spb" style="display:none" aria-label="Special"><img alt=""><span>SPECIAL</span></button>
<button id="spBtn2" class="spb" style="display:none" aria-label="Player 2 special"><img alt=""><span>SPECIAL</span></button>
<button id="pauseBtn" style="display:none" aria-label="Pause">II</button>

function saveProg(){try{localStorage.setItem('zooburg-progress',JSON.stringify(PROG));}catch(e){}}
var newUnlocks=[],gameUnlocked=false;
function nextUnlock(){for(var i=0;i<UNLOCKS.length;i++)if(!PROG.unlocked[UNLOCKS[i].a])return UNLOCKS[i];return null;}
function unlockOf(a){for(var i=0;i<UNLOCKS.length;i++)if(UNLOCKS[i].a===a)return UNLOCKS[i];return null;}
function isUnlocked(a){return STARTERS.indexOf(a)>=0||!!PROG.unlocked[a];}
function progText(u){var v=PROG[u.stat];
 if(u.stat==='bestBoard')return 'Best: level '+(Math.floor((v-1)/3)+1);
 if(u.stat==='bestScore')return 'Best: '+v.toLocaleString('en-US');
 return Math.min(v,u.need)+'/'+u.need+' played';}
function recordProgress(){
 if(SCREEN==='play'||SCREEN==='pause'||PHASE==='end'){
  if(MODE==='pyramid'&&players[0]){PROG.bestScore=Math.max(PROG.bestScore,players[0].score);PROG.bestBoard=Math.max(PROG.bestBoard,boardNum);}
 }
 var got=[];
 // Animals unlock in order, at most one per game
 var u=nextUnlock();
 if(u&&!gameUnlocked&&PROG[u.stat]>=u.need){PROG.unlocked[u.a]=1;gameUnlocked=true;got.push(u.a);newUnlocks.push(u.a);}
 saveProg();
 if(got.length&&SCREEN==='play'){toast(ANIMALS[got[0]].name.toUpperCase()+' UNLOCKED!',got[0]);sfx('catch');}
}

function buildSprite(def){
 var c=document.createElement('canvas');c.width=16;c.height=16;var g=c.getContext('2d');
 for(var y=0;y<16;y++){var row=def.rows[y]+def.rows[y].split('').reverse().join('');
  for(var x=0;x<16;x++){var ch=row.charAt(x);if(ch!=='.'&&def.pal[ch]){g.fillStyle=def.pal[ch];g.fillRect(x,y,1,1);}}}
 return c;
}
function bigSprite(c,s){var b=document.createElement('canvas');b.width=16*s;b.height=16*s;var g=b.getContext('2d');g.imageSmoothingEnabled=false;g.webkitImageSmoothingEnabled=false;g.drawImage(c,0,0,b.width,b.height);return b;}

var AC=null,musicBus=null,sfxBus=null,duck=1;
var SET={music:true,sfx:true,mv:0.5,sv:0.8,voice:true,vv:0.8};
(function(){try{var s=JSON.parse(localStorage.getItem('zooburg-audio')||'null');if(s){for(var k in SET){if(typeof s[k]===typeof SET[k])SET[k]=s[k];}}}catch(e){}})();
function saveSet(){try{localStorage.setItem('zooburg-audio',JSON.stringify(SET));}catch(e){}}
function audioInit(){
 try{
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();
   sfxBus=AC.createGain();sfxBus.connect(AC.destination);musicBus=AC.createGain();musicBus.connect(AC.destination);applyVolumes(true);AC.onstatechange=updSoundHint;voiceInit();}}
  if(AC&&AC.state!=='running'&&!document.hidden){
   var pr=AC.resume();if(pr&&pr.catch)pr.catch(function(){});
   // iOS only unlocks audio when a sound is started inside the tap itself
   var sb=AC.createBufferSource();sb.buffer=AC.createBuffer(1,1,22050);sb.connect(AC.destination);sb.start(0);
  }
  if(AC&&MUS.want&&!MUS.cur)setMusic(MUS.want);
 }catch(e){}
 updSoundHint();
}
function updSoundHint(){var h=document.getElementById('sndHint');if(h)h.style.visibility=(AC&&AC.state!=='running'&&SET.music)?'visible':'hidden';}
function applyVolumes(now){
 if(!AC)return;var t=AC.currentTime;
 var sv=SET.sfx?SET.sv*SET.sv*1.6:0,mv=SET.music?SET.mv*SET.mv*1.6*duck:0;
 var vv=SET.voice?SET.vv*SET.vv*1.8:0;if(voiceBus){if(now)voiceBus.gain.value=vv;else{voiceBus.gain.cancelScheduledValues(t);voiceBus.gain.setTargetAtTime(vv,t,0.03);}}
 if(now){sfxBus.gain.value=sv;musicBus.gain.value=mv;return;}
 sfxBus.gain.cancelScheduledValues(t);sfxBus.gain.setTargetAtTime(sv,t,0.03);
 musicBus.gain.cancelScheduledValues(t);musicBus.gain.setTargetAtTime(mv,t,0.08);
}
function tone(f1,f2,dur,type,vol,delay){
 if(!AC||!SET.sfx)return;var t=AC.currentTime+(delay||0);var o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
 g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+0.05);
}
function arp(fs,step,type,vol){for(var i=0;i<fs.length;i++)tone(fs[i],fs[i],step*1.4,type,vol,i*step);}

 else if(n==='go')arp([440,660],0.12,'square',0.04);
 else if(n==='thud'){tone(120,38,0.32,'sine',0.32);tone(80,30,0.28,'triangle',0.18,0.01);tone(300,60,0.08,'sawtooth',0.05);}
 else if(n==='dig'){tone(160,80,0.18,'square',0.05);tone(120,60,0.14,'sawtooth',0.03,0.06);}
 else if(n==='bonk'){tone(700,180,0.12,'square',0.07);tone(1100,1100,0.05,'triangle',0.05,0.1);}
 else if(n==='unlock'){tone(1200,500,0.16,'triangle',0.06);}
 else if(n==='power')arp([523,659,784,1047,1319,1568],0.06,'square',0.06);

}

function newEnt(kind,r,x){return {kind:kind,r:r,x:x,fr:r,fx:x,t:1,state:'idle',dirUp:false,dropY:0,fallY:0,fallV:0,timer:0,wait:0,hopDur:0.26,dead:false,flap:0,move:null,lastDir:'DL',stand:0};}
function makePlayer(id,animal,home,board,cpu){var p=newEnt('player',home.r,home.x);p.id=id;p.animal=animal;p.home=home;p.homeBoard=board;p.cpu=cpu;p.held=null;p.buf=null;p.inv=0;p.curse=0;p.score=0;p.lives=3;p.cpuWait=0.5;p.waitT=0;p.mudNext=false;p.dizzy=0;p.spin=0;p.power=0;p.chain=0;return p;}
function hopEnt(e,dir,mult,move){var d=DIRS[dir];e.fr=e.r;e.fx=e.x;e.r+=d[0]*mult;e.x+=d[1]*mult;e.t=0;e.state='hop';e.dirUp=d[0]<0;e.lastDir=dir;e.move=move||null;e.stand=0;}
function startHop(e,dir){hopEnt(e,dir,1,null);}
function startDrop(e){e.state='drop';e.dropY=-Math.max(H*0.5,CW*5);e.fr=e.r;e.fx=e.x;e.move=null;}
function startFall(e){e.state='fall';e.fallY=0;e.fallV=-CW;e.timer=0;}
function stepMotion(e,dt){
 if(e.state==='hop'){e.t+=dt/e.hopDur;if(e.t>=1){e.t=1;return 'land';}}
 else if(e.state==='drop'){e.dropY+=dt*CW*18;if(e.dropY>=0){e.dropY=0;return 'land';}}
 else if(e.state==='fall'){e.fallV+=dt*CW*30;e.fallY+=e.fallV*dt;e.timer+=dt;if(e.timer>1.1)return 'fallen';}
 return null;
}
function entPos(e){
 if(e.cheer){var bob=Math.abs(Math.sin(TIME*7+e.ph))*CW*0.18;return {x:sx(e.x),y:sy(e.r)-bob,lift:bob};}
 if(e.kind==='parrot'){var bob=e.state==='perch'?0:Math.sin(e.flap)*CW*0.06;return {x:sx(e.gx),y:sy(e.gy)-CW*0.28-bob,lift:CW*0.28+bob};}
 if(e.kind==='gorilla')return {x:sx(e.gx),y:sy(e.gy)+e.dropY,lift:0};
 if(e.kind==='mole')return {x:sx(e.x),y:sy(e.r),lift:0};
 if(e.state==='hop'){
  var k=e.t,x0=sx(e.fx),y0=sy(e.fr),x1=sx(e.x),y1=sy(e.r);
  var amp=e.move==='slide'?0.06:(e.move==='pounce'?1.0:e.move==='tramp'?1.5:(e.move==='walk'?0.14:(e.dirUp?0.6:0.38)));
  var lift=Math.sin(Math.PI*k)*CW*amp;return {x:x0+(x1-x0)*k,y:y0+(y1-y0)*k-lift,lift:lift};
 }
 if(e.state==='fall')return {x:sx(e.x),y:sy(e.r)+e.fallY,lift:0};
 if(e.state==='drop')return {x:sx(e.x),y:sy(e.r)+e.dropY,lift:-e.dropY};
 if(e.state==='ride')return {x:e.rx,y:e.ry,lift:CW};
 return {x:sx(e.x),y:sy(e.r),lift:0};
}
function dirKey(dr,dx){return dr<0?(dx>0?'UR':'UL'):(dx>0?'DR':'DL');}
function addScore(p,n){if(p)p.score+=n;}
function floatText(r,x,text,color){floats.push({r:r,x:x,text:text,color:color,t:0});}
function setBanner(text,sub,color,dur){banner={text:text,sub:sub,color:color,t:dur,max:dur};}

function updPlayer(p,dt){
 if(p.inv>0)p.inv-=dt;if(p.curse>0)p.curse-=dt;
 if(p.power>0){p.power-=dt;if(p.power<=0){p.power=0;sfx('unfreeze');}}
 if(p.sneak>0)p.sneak-=dt;if(p.spin>0)p.spin-=dt;if(p.dizzy>0)p.dizzy-=dt;
 if(isFrozen(p))return;
 if(p.waitT>0)p.waitT-=dt;
 if(p.state==='idle'){
  var c=getCube(p.r,p.x);
  if(!c){p.dirUp=false;startFall(p);p.fallV=0;p.thudDone=false;sfx('fall');voice('ohno',p);p.auto=null;return;}
  if(PHASE==='run'&&p.auto){autoStep(p);if(p.state==='hop')return;}
  if(PHASE==='run'&&p.spQueued&&!p.auto){p.spQueued=false;useSpecial(p);if(p.state!=='idle')return;}
  if(PHASE==='run'){
   if(WOB>0){p.stand+=dt;var w=p.stand/WOB;if(w>c.wig)c.wig=w;if(p.stand>=WOB){dropCube(c);return;}}
   if(p.waitT<=0){
    if(p.cpu)cpuThink(p,dt);
    else{var d=p.buf||p.held;if(d){p.buf=null;startHop(p,d);p.hopDur=p.mudNext?0.45:0.26;p.mudNext=false;sfx('hop');}}
   }
  }
 }else if(p.state==='hit'){p.timer+=dt;if(p.timer>1.2)afterHit(p);}
 else if(p.state==='ride'){updRide(p,dt);}
 else{
  if(p.state==='fall'&&!p.thudDone&&p.timer>=0.75){p.thudDone=true;landThud(p);}
  var wasDrop=p.state==='drop';var res=stepMotion(p,dt);
  if(res==='land')playerLand(p,wasDrop);else if(res==='fallen')afterFall(p);
 }
}

 }

 startFall(p);p.fallV=-CW*2;p.thudDone=false;sfx('fall');voice('ohno',p);

function paint(p,c){

function updRide2(p,dt){

 if(g&&!R.leg2){x0=sx(R.pz.x);y0=sy(R.pz.r);x1=sx(g.gx);y1=sy(g.gy)-CW*0.7;dur=1.0;}

 }
 if(R.t>=1&&g&&!R.leg2){ // landed on the gorilla: bop him, then bounce on to the start
  if(!g.dead&&(g.state==='sit'||g.state==='enter')){bonkGorilla(g,p);floatText(g.gy,g.gx,'PIZZA BOP!','#ffd23f');}

function cpuWant(p,c){if(!c)return 0;if(p.power>0&&MODE==='cpux')return done(c,p.id)?0:2;if(c.locked)return 0;if(!done(c,p.id))return 2;if(showdown)return 1;return 0;}
function cpuBFS(p,blocked,strict,goal){
 var seen={};seen[p.r+','+p.x]=1;var q=[{r:p.r,x:p.x,first:null,d:0}],qi=0,best1=null,k;
 while(qi<q.length){
  var n=q[qi++];
  if(n.d>0){
   if(goal&&n.r===goal.r&&n.x===goal.x)return n.first;
   var cc=getCube(n.r,n.x),w=cpuWant(p,cc);
   if(w===2&&!goal)return n.first;if(w===1&&!best1)best1=n;if(best1&&!goal&&n.d>best1.d+3)return best1.first;
   if(strict&&cc&&done(cc,p.id))continue;
  }
  for(k in DIRS){var d=DIRS[k],nr=n.r+d[0],nx=n.x+d[1],key=nr+','+nx;
   if(seen[key]||!getCube(nr,nx))continue;if(blocked[key]&&n.d<2)continue;
   seen[key]=1;q.push({r:nr,x:nx,first:n.first||k,d:n.d+1});}
 }
 return (best1&&!goal)?best1.first:null;
}
function cpuThink(p,dt){
 p.cpuWait-=dt;if(p.cpuWait>0)return;p.cpuWait=rnd(0.1,0.3);
 if(specialOn()&&p.charges>0&&!p.auto&&PHASE==='run'){var near=99;for(var ci2=0;ci2<enemies.length;ci2++){var ce=enemies[ci2];if(ce.dead||ce.state==='fall'||ce.kind==='gorilla'||ce.kind==='parrot')continue;near=Math.min(near,cellDist(ce.r,ce.x,p.r,p.x));}
  if((near<=2&&Math.random()<0.35)||Math.random()<0.04){useSpecial(p);if(p.state!=='idle'||p.auto)return;}}
 var blocked={},i,k,d,kNear=false,sloth=null;
 for(i=0;i<enemies.length;i++){var e=enemies[i];if(e.dead||e.state==='fall')continue;
  if(e.kind==='sloth'&&e.state==='idle'&&Math.max(Math.abs(e.r-p.r),Math.abs(e.x-p.x))<=4){sloth=e;continue;}
  if(e.kind==='parrot'||e.kind==='gorilla'||e.kind==='sloth'||e.kind==='mole')continue;
  if(e.hunt&&e.hunt!==p)continue;
  if(stopT>0&&stopBy===p)continue;
  if(p.power>0)continue;

 var tgt=null,best=1e9,eb=getCube(e.r,e.x);

// one step of a skill that moves you for a while (slide, dash, pinball roll)
function autoStep(p){
 var a=p.auto,dir=null;
 if(a.kind==='slide'||a.kind==='dash'){
  if(a.left>0&&runLength(p,a.dir,1)){dir=a.dir;a.left--;}
 }else if(a.kind==='roll'){
  while(a.targets.length){var t=a.targets[0],gr,gx;
   if(t.e){if(t.e.dead||t.e.state==='fall'||t.e.state==='leave'||t.e.state==='bonk'){a.targets.shift();continue;}gr=t.e.cheer?t.e.edge.r:t.e.r;gx=t.e.cheer?t.e.edge.x:t.e.x;}else{gr=t.r;gx=t.x;}
   if(p.r===gr&&p.x===gx){if(t.e)knockOff(t.e,p,'PINBALL');a.targets.shift();continue;}
   dir=bfsDir(p,gr,gx);if(!dir){a.targets.shift();continue;}break;}
  if(++a.steps>18)dir=null;
 }
 if(!dir){p.auto=null;return;}
 hopEnt(p,dir,1,'slide');p.hopDur=a.kind==='roll'?0.13:0.11;if(a.kind==='roll')p.spin=0.3;
}

 if((e.state==='rise'||e.state==='up')&&(!c||c.gone)){e.state='sink';e.t=0;}

function collide(){
 for(var i=0;i<players.length;i++){
  var p=players[i];if(p.state==='hit'||p.state==='ride'||p.state==='fall'||p.state==='drop'||isFrozen(p))continue;
  var pp=entPos(p);
  if(p.power>0)powerCollide(p,pp);
  if(p.auto||(p.state==='hop'&&p.move==='pounce'))skillCollide(p,pp);
  for(var j=0;j<enemies.length;j++){
   var e=enemies[j];if(e.dead||e.kind==='gorilla'||e.cheer)continue;
   if(e.kind==='mole'){if((e.state==='rise'||e.state==='up')&&p.state==='idle'&&p.r===e.r&&p.x===e.x){e.state='bonk';e.t=0;addScore(p,150);floatText(e.r,e.x,'BONK! +150','#3cff8a');sfx('bonk');}continue;}
   if(e.hunt&&e.hunt!==p)continue;
   var ep=entPos(e),dx,dy;
   if(e.kind==='parrot'){
    if(e.state==='leave')continue;
    dx=pp.x-ep.x;dy=pp.y-ep.y;
    if(dx*dx+dy*dy<CW*CW*0.3){e.state='leave';e.lx=e.gx+(Math.random()<0.5?-14:14);addScore(p,100);floatText(p.r,p.x,'CAUGHT +100','#ffd23f');sfx('catch');}
    continue;
   }
   if(e.state==='fall'||e.state==='drop')continue;
   var close=Math.abs(pp.x-ep.x)<CW*0.4&&Math.abs(pp.y-ep.y)<CW*0.32;
   if(e.kind==='sloth'){if(close)catchSloth(p,e);continue;}
   if(stopT>0||p.inv>0||p.power>0||p.auto||p.sneak>0)continue;
   if(close){hitPlayer(p);if(e.hunt){e.huntT=0;}break;}
  }
 }
}

function update(dt){
 TIME+=dt;
 var gp=gpRead(),anyStart=false,i;
 for(i=0;i<gp.length;i++)if(gp[i].start)anyStart=true;
 if(anyStart&&!gpStartPrev){if(SCREEN==='play')pauseGame();else if(SCREEN==='pause')resumeGame();else if(SCREEN==='over')doRematch();}
 gpStartPrev=anyStart;
 for(var gi=0;gi<2;gi++){var gsp=!!(gp[gi]&&gp[gi].sp);if(gsp&&!gpSpPrev[gi]&&SCREEN==='play')useSpecial(players[gi]);gpSpPrev[gi]=gsp;}
 if(SCREEN!=='play')return;
 readInputs(gp);
 if(PHASE==='ready'){phaseT+=dt;if(phaseT>readyLen){PHASE='run';for(i=0;i<ROSTER.length;i++)seenKinds[ROSTER[i]]=1;}}
 else if(PHASE==='clear'){phaseT+=dt;if(phaseT>2.2){nextBoard();return;}}
 if(shakeT>0)shakeT-=dt;
 if(stopT>0){stopT-=dt;if(stopT<=0){stopT=0;stopBy=null;sfx('unfreeze');}}
 if(PHASE==='run'){
  gameT+=dt;
  if(MODE==='pyramid'){if(BONUS){bonusT+=dt;if(bonusT>=60){bonusT=60;PHASE='clear';phaseT=0;setBanner('TIME UP!','NO RECORD THIS TIME','#ff8a3c',2);sfx('undo');}}else boardT+=dt;}
  if(showdown||MODE==='h2h'){var prev=Math.ceil(timeLeft);timeLeft-=dt;
   if(Math.ceil(timeLeft)!==prev&&timeLeft<=10&&timeLeft>0)sfx('tick');
   if(timeLeft<=0){timeLeft=0;endGame();return;}}
  if(freezeT>0)freezeT-=dt;
  else if(stopT<=0){spawnT-=dt;if(spawnT<=0){spawnT=rnd(3.2,5.5)/SPEED;spawnEnemy();}
   if(MODE!=='pyramid'){moleT-=dt;if(moleT<=0){moleT=rnd(13,17);spawnMole();}}}
 }
 for(i=0;i<cubeList.length;i++)cubeList[i].wig=0;
 for(i=0;i<players.length;i++)updPlayer(players[i],dt);
 if(PHASE==='end')return;
 if(PHASE==='run'&&freezeT<=0&&stopT<=0){
  for(i=0;i<enemies.length;i++)updEnemy(enemies[i],dt);
  var bk=[];for(i=0;i<bananas.length;i++){var b=bananas[i];b.t+=dt/0.7;if(b.t>=1){if(!b.c.gone){b.c.peel=true;b.c.peelT=20;if(MODE!=='pyramid')bananaHit(b.c);}}else bk.push(b);}bananas=bk;
 }
 var keep=[];for(i=0;i<enemies.length;i++)if(!enemies[i].dead)keep.push(enemies[i]);enemies=keep;
 if(PHASE==='run'){collide();if(clouds.length)updClouds(dt);}
 for(i=0;i<cubeList.length;i++){var c=cubeList[i];
  if(c.peel&&PHASE==='run'){c.peelT=(c.peelT||20)-dt;if(c.peelT<=0){c.peel=false;c.peelT=0;}}
  if(c.trap>0&&PHASE==='run')c.trap-=dt;
  if(c.flash>0)c.flash=Math.max(0,c.flash-dt*3);
  if(c.gone){c.goneT+=dt;if(c.goneT>1.8){resetCube(c);c.appear=0;c.appearDir=-1;}}
  else if(!c.hidden&&c.appear<1)c.appear=Math.min(1,c.appear+dt*1.6);}
 var fk=[];for(i=0;i<floats.length;i++){floats[i].t+=dt;if(floats[i].t<1.2)fk.push(floats[i]);}floats=fk;
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
}

 document.getElementById('volVoice').addEventListener('change',function(){saveSet();voice('nice','zebra',{force:true});});
 window.addEventListener('resize',resize);
 window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
 // Zoom handling: block pinch/double-tap zoom normally, but if the page does get
 // zoomed in (e.g. iOS double-tap), allow pinching back out to normal size.
 function isZoomed(){var vv=window.visualViewport;return !!(vv&&vv.scale>1.01);}
 function updZoom(){document.documentElement.classList.toggle('zoomed',isZoomed());}
 if(window.visualViewport){window.visualViewport.addEventListener('resize',updZoom);window.visualViewport.addEventListener('scroll',updZoom);}
 function blockGesture(e){if(!isZoomed())e.preventDefault();}
 document.addEventListener('gesturestart',blockGesture);
 document.addEventListener('gesturechange',blockGesture);
 document.addEventListener('touchmove',function(e){if(e.touches.length>1&&!isZoomed())e.preventDefault();},{passive:false});
 document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
 var lastTapEnd=0;
 document.addEventListener('touchend',function(e){var now=Date.now();var t=e.target;
  if(now-lastTapEnd<350&&e.changedTouches.length===1&&!(t&&t.closest&&t.closest('button,a,input,select,textarea,.pad')))e.preventDefault();
  lastTapEnd=now;},{passive:false});
 updZoom();
 resize();showScreen('menu');audioInit();requestAnimationFrame(loop);
}
init();
