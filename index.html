<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07021a">
<title>Zooburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#07021a}
body{font-family:'Press Start 2P','Courier New',monospace;color:#f4ecff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);touch-action:none;-webkit-text-size-adjust:100%}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.screen{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.dim{background:rgba(7,2,26,0.84)}
.title{font-size:clamp(30px,11vw,72px);letter-spacing:2px;margin:0 0 4px;line-height:1.1;font-weight:normal}
.title span{display:inline-block;text-shadow:0 0 6px currentColor,0 0 18px currentColor,3px 3px 0 #2a0a48}
.tag{font-size:10px;color:#b9a6ff;margin:10px 0 16px;line-height:1.8}
.lineup{display:flex;justify-content:center;margin:4px 0 14px}
.lineup img{width:56px;height:56px;margin:0 6px;image-rendering:pixelated;animation:bob 0.6s steps(2) infinite alternate}
.lineup img:nth-child(2){animation-delay:0.15s}
.lineup img:nth-child(3){animation-delay:0.3s}
.lineup img:nth-child(4){animation-delay:0.45s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.btn{font-family:inherit;font-size:12px;color:#fff;background:#160733;border:3px solid #29f3ff;box-shadow:0 0 12px #29f3ff,inset 0 0 10px rgba(41,243,255,0.35);border-radius:4px;padding:14px 16px;margin:7px;min-width:230px;cursor:pointer;line-height:1.5}
.btn small{display:block;font-size:8px;color:#b9a6ff;margin-top:6px}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
.btns{display:flex;flex-wrap:wrap;justify-content:center}
.hint{font-size:8px;color:#8f7fd0;line-height:2.1;max-width:520px;margin-top:14px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;max-width:640px}
.card{font-family:inherit;color:#fff;background:#140832;border:3px solid #ffffff;border-radius:6px;padding:10px 8px;width:128px;margin:6px;cursor:pointer;position:relative}
.card img{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto 8px}
.card .nm{font-size:10px}
.card .who{position:absolute;top:6px;left:6px;font-size:8px;padding:3px 4px;background:#ffffff;color:#07021a}
h2{font-size:13px;margin:0 0 16px;line-height:1.7;font-weight:normal}
#pauseBtn{position:fixed;z-index:6;width:40px;height:40px;font-family:inherit;font-size:11px;color:#fff;background:#160733;border:2px solid #ff3cf0;border-radius:4px;box-shadow:0 0 10px #ff3cf0;padding:0}
.pad{position:fixed;z-index:5;border-radius:50%;background:#12062e;border:3px solid #ff3cf0;opacity:0.9;touch-action:none}
.cross{position:absolute;left:13%;top:13%;width:74%;height:74%;transform:rotate(45deg);-webkit-transform:rotate(45deg);pointer-events:none}
.arm{position:absolute;width:34%;height:34%;background:#2b1660;border:2px solid #8a6cff;border-radius:6px}
.a-up{left:33%;top:0}.a-down{left:33%;bottom:0}.a-left{left:0;top:33%}.a-right{right:0;top:33%}
.hub{position:absolute;left:33%;top:33%;width:34%;height:34%;background:#2b1660}
.arm:after{content:'';position:absolute;left:50%;top:50%;width:0;height:0;border:6px solid transparent}
.a-up:after{border-bottom-color:#ffffff;margin:-12px 0 0 -6px}
.a-down:after{border-top-color:#ffffff;margin:0 0 0 -6px}
.a-left:after{border-right-color:#ffffff;margin:-6px 0 0 -12px}
.a-right:after{border-left-color:#ffffff;margin:-6px 0 0 0}
@media (prefers-reduced-motion: reduce){.lineup img{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>

<div id="menu" class="screen" style="display:none">
  <h1 class="title" aria-label="Zooburg"><span style="color:#ff3cf0">Z</span><span style="color:#ffd23f">O</span><span style="color:#29f3ff">O</span><span style="color:#3cff8a">B</span><span style="color:#ff9a1f">U</span><span style="color:#c46bff">R</span><span style="color:#ff3cf0">G</span></h1>
  <div class="tag">Hop the cubes. Paint the zoo. Steal the bridge.</div>
  <div class="lineup" id="lineup"></div>
  <div class="btns">
    <button class="btn" data-mode="pyramid" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">Classic pyramid<small>1 player, portrait</small></button>
    <button class="btn" data-mode="cpu">Versus CPU<small>1 player, landscape</small></button>
    <button class="btn" data-mode="2p" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">2 players<small>Same phone or 2 controllers</small></button>
  </div>
  <div class="hint">The D-pad is turned 45&deg; like the arcade stick, so up hops up-right. Pizza boxes fly you back to the top. Keyboard: WASD and arrow keys.</div>
</div>

<div id="select" class="screen" style="display:none">
  <h2 id="selHead"></h2>
  <div class="cards" id="cards"></div>
  <div class="btns"><button class="btn" id="selBack" style="min-width:140px">Back</button></div>
</div>

<div id="over" class="screen dim" style="display:none">
  <div id="overBody"></div>
  <div class="btns">
    <button class="btn" id="btnRematch" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">Rematch</button>
    <button class="btn" id="btnAnimals">Change animals</button>
    <button class="btn" id="btnMenu" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">Main menu</button>
  </div>
</div>

<div id="pause" class="screen dim" style="display:none">
  <h2>Paused</h2>
  <div class="btns">
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn" id="btnQuit" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">Main menu</button>
  </div>
</div>

<button id="pauseBtn" style="display:none" aria-label="Pause">II</button>

<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,SAFE={t:0,r:0,b:0,l:0};
var CW=40,OX=0,OY=0,TIME=0,bg=null;
var FONT='"Press Start 2P", "Courier New", monospace';

function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hexRgb(h){var n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,k){var A=hexRgb(a),B=hexRgb(b);return 'rgb('+Math.round(A[0]+(B[0]-A[0])*k)+','+Math.round(A[1]+(B[1]-A[1])*k)+','+Math.round(A[2]+(B[2]-A[2])*k)+')';}
/* ellipse helper (no ctx.ellipse on older iOS) */
function CE(x,y,rx,ry){ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);ctx.beginPath();ctx.arc(0,0,rx,0,Math.PI*2);ctx.restore();}

/* ================= SPRITES (16x16, left half mirrored) ================= */
var SPR={
 monkey:{pal:{k:'#2a1406',b:'#8b4a1c',t:'#f2c48d',w:'#ffffff',e:'#111111'},rows:[
  '........','....kkkk','..kkbbbb','.kbbbbbb','kttkbbbb','kttkbttt','.kkbtwet','..kbtttt',
  '..kbtttt','...kbttt','...kbtkk','..kkbbbb','.kbbbbtt','kbbkbbtt','kbk.kbbb','.k...kkk']},
 penguin:{pal:{k:'#0a0a1a',n:'#2b3160',w:'#f4f7ff',o:'#ff9a1f',e:'#111111'},rows:[
  '........','.....kkk','...kknnn','..knnnnn','..knnwww','.knnwwew','.knnwwww','.knnwwoo',
  '.knnwwwo','knnnwwww','knnwwwww','knnwwwww','.knnwwww','..knwwww','...kkkkk','..ooook.']},
 lion:{pal:{k:'#3a1a00',m:'#d9611e',y:'#ffc93c',e:'#111111',p:'#7a2e1a'},rows:[
  '...kkkkk','.kkmmmmm','kmmmmmmm','kmmmyyyy','kmmyyyyy','kmmyeyyy','kmmyyyyy','kmmyyypp',
  'kmmyyyyk','.kmmyyyy','..kmmmmm','...kyyyy','..kyyyyy','..kyyyyy','..kyyk..','..kkkk..']},
 skunk:{pal:{k:'#05050f',n:'#3d3266',w:'#ffffff',e:'#111111',p:'#ff7aa8'},rows:[
  '........','..kk..kw','.knnkknw','.knnnnnw','knnnnnnw','knnnwenw','knnnnnnw','knnnnnpp',
  '.knnnnnn','..knnnnn','..knnnww','.knnnnww','.knnnnnw','.knnnnnn','..knnk..','..kkkk..']},
 keeper:{pal:{k:'#101010',h:'#2f8f3f',s:'#f1b98a',g:'#c9a85a',e:'#111111',d:'#5a4630'},rows:[
  '........','...kkkkk','..khhhhh','.khhhhhh','kkkkkkkk','..ksssss','..ksesss','..ksssss',
  '..ksskkk','...kssss','..kggggg','.kgggggg','.ksggggg','..kddddd','..kddk..','..kkkk..']},
 roo:{pal:{k:'#2a1000',r:'#c8642a',t:'#f2c48d',e:'#111111'},rows:[
  '..kk....','.krk....','.krk.kkk','..krkrrr','..krrrrr','.krrrerr','.krrrrrr','..krrrrk',
  '...krrrr','..krrttt','.krrtttt','krkrtttt','.kkrtttt','..krrttt','.krrrk..','kkkkkk..']},
 parrot:{pal:{k:'#1a0010',r:'#ff2a4a',y:'#ffd23f',b:'#2a7bff',w:'#ffffff',e:'#111111'},rows:[
  '........','.....kkk','....krrr','...krrrr','...krwer','...krrry','...krrrk','kbk.krrr',
  'kbbkrrrr','kbbyrrrr','.kbyyrrr','..kbyrrr','...kbrrr','....kbbb','.....kbb','......kk']}
};
var ANIMALS={monkey:{name:'Monkey',color:'#ff9a1f'},penguin:{name:'Penguin',color:'#29f3ff'},lion:{name:'Lion',color:'#ffd23f'},skunk:{name:'Skunk',color:'#c46bff'}};
var ORDER=['monkey','penguin','lion','skunk'];
var SPR_C={},SPR_URL={};
function buildSprite(def){
 var c=document.createElement('canvas');c.width=16;c.height=16;var g=c.getContext('2d');
 for(var y=0;y<16;y++){var row=def.rows[y]+def.rows[y].split('').reverse().join('');
  for(var x=0;x<16;x++){var ch=row.charAt(x);if(ch!=='.'&&def.pal[ch]){g.fillStyle=def.pal[ch];g.fillRect(x,y,1,1);}}}
 return c;
}
function bigSprite(c,s){var b=document.createElement('canvas');b.width=16*s;b.height=16*s;var g=b.getContext('2d');g.imageSmoothingEnabled=false;g.webkitImageSmoothingEnabled=false;g.drawImage(c,0,0,b.width,b.height);return b;}

/* ================= AUDIO ================= */
var AC=null;
function audioInit(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f1,f2,dur,type,vol,delay){
 if(!AC)return;var t=AC.currentTime+(delay||0);var o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
 g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.05);
}
function arp(fs,step,type,vol){for(var i=0;i<fs.length;i++)tone(fs[i],fs[i],step*1.4,type,vol,i*step);}
function sfx(n){
 if(!AC)return;
 if(n==='hop')tone(420,620,0.07,'square',0.03);
 else if(n==='flip')tone(700,1050,0.08,'square',0.04);
 else if(n==='lock'){tone(880,880,0.08,'triangle',0.09);tone(1320,1320,0.14,'triangle',0.09,0.07);}
 else if(n==='fall')tone(900,60,1.0,'sawtooth',0.04);
 else if(n==='pizza')arp([523,659,784,1047,1319],0.07,'square',0.04);
 else if(n==='hit'){tone(240,50,0.35,'sawtooth',0.07);tone(180,40,0.35,'square',0.04,0.05);}
 else if(n==='squawk'){tone(1400,2200,0.06,'square',0.03);tone(1600,2400,0.06,'square',0.03,0.08);}
 else if(n==='catch')arp([784,988,1175,1568],0.05,'triangle',0.06);
 else if(n==='splat')tone(300,40,0.45,'sawtooth',0.07);
 else if(n==='boing')tone(160,420,0.1,'sine',0.03);
 else if(n==='bridge')arp([392,523,659,784,1047,784,1047],0.09,'triangle',0.07);
 else if(n==='tick')tone(1000,1000,0.05,'square',0.03);
 else if(n==='win')arp([523,659,784,1047,784,1047,1319],0.11,'square',0.05);
 else if(n==='clear')arp([659,784,988,1319],0.08,'triangle',0.07);
 else if(n==='go')arp([440,660],0.12,'square',0.04);
}

/* ================= BOARD ================= */
var DIRS={UR:[-1,1],DR:[1,1],DL:[1,-1],UL:[-1,-1]};
var STYLES={A:{l:'#4a1470',r:'#2a0a48',e:'#ff3cf0'},B:{l:'#0e4a6e',r:'#072a44',e:'#29f3ff'},X:{l:'#6e4a0e',r:'#44290a',e:'#ffd23f'},G:{l:'#0e6e3a',r:'#073f22',e:'#3cff8a'},O:{l:'#7a2a0e',r:'#4a1606',e:'#ff8a3c'}};
var LEVEL_STYLES=['A','B','G','O'];
var cubes={},cubeList=[],pizzas=[],boards={},players=[],enemies=[],floats=[];
var SCREEN='menu',MODE='pyramid',selMode='pyramid',PHASE='ready',phaseT=0;
var showdown=false,timeLeft=90,level=1,styleIdx=0,spawnT=3,freezeT=0,gameT=0,SPEED=1,banner=null;
var PCOL=[null,'#ffffff','#ffffff'];
var picks=[],pickStage=1,padDir=[null,null],pads=[];
var CUBE={};

function addCube(r,x,b){var c={r:r,x:x,board:b,owner:0,locked:false,hidden:false,appear:1,flash:0};cubes[r+','+x]=c;cubeList.push(c);return c;}
function addPyr(b,ax,rows){for(var r=0;r<rows;r++){for(var i=0;i<=r;i++)addCube(r,ax-r+2*i,b);}boards[b]={id:b,ax:ax,rows:rows};}
function setupBoards(){
 cubes={};cubeList=[];pizzas=[];boards={};
 if(MODE==='pyramid'){
  addPyr('A',0,7);
  pizzas.push({r:3,x:-5,b:'A',used:false},{r:4,x:6,b:'A',used:false});
 }else{
  addPyr('A',0,6);addPyr('B',14,6);
  var br=[[6,6],[5,7],[6,8]];
  for(var i=0;i<br.length;i++){var c=addCube(br[i][0],br[i][1],'X');c.hidden=true;c.appear=-i*0.35;}
  pizzas.push({r:2,x:-4,b:'A',used:false},{r:4,x:6,b:'A',used:false},{r:4,x:8,b:'B',used:false},{r:2,x:18,b:'B',used:false});
 }
 cubeList.sort(function(a,b){return (a.r-b.r)||(a.x-b.x);});
}
function getCube(r,x){var c=cubes[r+','+x];return (c&&!c.hidden)?c:null;}
function pizzaAt(r,x){for(var i=0;i<pizzas.length;i++){var p=pizzas[i];if(!p.used&&p.r===r&&p.x===x)return p;}return null;}
function sx(x){return OX+x*CW/2;}
function sy(r){return OY+r*CW*0.75;}
function cubeStyle(c){if(MODE==='pyramid')return LEVEL_STYLES[styleIdx%LEVEL_STYLES.length];return c.board==='A'?'A':(c.board==='B'?'B':'X');}

function padSize(){return Math.round(Math.max(110,Math.min(160,Math.min(W,H)*0.36)));}
function bottomPads(){return MODE==='pyramid'||H>W;}
function computeLayout(){
 if(!cubeList.length)return;
 var minX=1e9,maxX=-1e9,maxR=0,i,c;
 for(i=0;i<cubeList.length;i++){c=cubeList[i];if(c.x<minX)minX=c.x;if(c.x>maxX)maxX=c.x;if(c.r>maxR)maxR=c.r;}
 for(i=0;i<pizzas.length;i++){c=pizzas[i];if(c.x<minX)minX=c.x;if(c.x>maxX)maxX=c.x;}
 var P=padSize(),left=SAFE.l+8,right=W-SAFE.r-8,top=SAFE.t+46,bottom=H-SAFE.b-8;
 if(bottomPads())bottom-=P+18;else{left+=P*0.45+12;right-=P*0.45+12;}
 var aw=right-left,ah=bottom-top,spanW=(maxX-minX)/2+1,spanH=1.65+0.75*maxR;
 CW=Math.max(16,Math.floor(Math.min(aw/spanW,ah/spanH,96)));
 OX=left+(aw-spanW*CW)/2+CW/2-minX*CW/2;
 OY=top+(ah-spanH*CW)/2+0.9*CW;
}

/* pre-rendered neon cubes */
function cubeImg(style,owner,locked){
 var key=style+'|'+owner+'|'+(locked?1:0);
 if(CUBE[key])return CUBE[key];
 var m=Math.ceil(CW*0.16),w=CW,h=CW/2,s=CW/2;
 var c=document.createElement('canvas');c.width=Math.ceil((w+2*m)*DPR);c.height=Math.ceil((h+s+2*m)*DPR);
 var g=c.getContext('2d');g.scale(DPR,DPR);
 var cx=m+w/2,t=m,st=STYLES[style],i,yy;
 function poly(p){g.beginPath();g.moveTo(p[0],p[1]);for(var j=2;j<p.length;j+=2)g.lineTo(p[j],p[j+1]);g.closePath();}
 var TOP=[cx,t,cx+w/2,t+h/2,cx,t+h,cx-w/2,t+h/2];
 var LF=[cx-w/2,t+h/2,cx,t+h,cx,t+h+s,cx-w/2,t+h/2+s];
 var RF=[cx+w/2,t+h/2,cx,t+h,cx,t+h+s,cx+w/2,t+h/2+s];
 poly(LF);g.fillStyle=st.l;g.fill();
 poly(RF);g.fillStyle=st.r;g.fill();
 g.save();poly(LF);g.clip();g.fillStyle='rgba(255,255,255,0.07)';for(yy=t;yy<t+h+s;yy+=4)g.fillRect(cx-w/2,yy,w/2,1);g.restore();
 g.save();poly(RF);g.clip();g.fillStyle='rgba(0,0,0,0.18)';for(yy=t+2;yy<t+h+s;yy+=4)g.fillRect(cx,yy,w/2,1);g.restore();
 var top=owner?PCOL[owner]:'#1c1f5a';
 poly(TOP);g.fillStyle=top;g.fill();
 var k=0.56;poly([cx,t+h*(1-k)/2,cx+w/2*k,t+h/2,cx,t+h-h*(1-k)/2,cx-w/2*k,t+h/2]);
 g.fillStyle=owner?mix(top,'#ffffff',0.35):'#272d7c';g.fill();
 if(locked){k=0.28;poly([cx,t+h*(1-k)/2,cx+w/2*k,t+h/2,cx,t+h-h*(1-k)/2,cx-w/2*k,t+h/2]);g.fillStyle='#ffffff';g.fill();}
 g.lineJoin='round';g.lineWidth=Math.max(1.5,CW/26);
 g.strokeStyle=locked?'#ffffff':st.e;g.shadowColor=locked?top:st.e;g.shadowBlur=m*(locked?1.2:0.9);
 g.beginPath();g.moveTo(cx,t);g.lineTo(cx+w/2,t+h/2);g.lineTo(cx+w/2,t+h/2+s);g.lineTo(cx,t+h+s);g.lineTo(cx-w/2,t+h/2+s);g.lineTo(cx-w/2,t+h/2);g.closePath();g.stroke();
 g.beginPath();g.moveTo(cx-w/2,t+h/2);g.lineTo(cx,t+h);g.lineTo(cx+w/2,t+h/2);g.moveTo(cx,t+h);g.lineTo(cx,t+h+s);g.stroke();
 c.m=m;CUBE[key]=c;return c;
}

function buildBG(){
 bg=document.createElement('canvas');bg.width=Math.round(W*DPR);bg.height=Math.round(H*DPR);
 var g=bg.getContext('2d');g.scale(DPR,DPR);
 var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#07021a');gr.addColorStop(0.62,'#1a0838');gr.addColorStop(1,'#3a0d4f');
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 var seed=7;function sr(){seed=(seed*16807)%2147483647;return seed/2147483647;}
 for(var i=0;i<150;i++){g.globalAlpha=0.3+sr()*0.7;g.fillStyle=sr()<0.2?'#29f3ff':(sr()<0.15?'#ff3cf0':'#ffffff');var z=sr()<0.15?2:1;g.fillRect(Math.floor(sr()*W),Math.floor(sr()*H*0.72),z,z);}
 g.globalAlpha=1;
 var hy=H*0.74;
 var hg=g.createLinearGradient(0,hy-70,0,hy);hg.addColorStop(0,'rgba(255,60,240,0)');hg.addColorStop(1,'rgba(255,60,240,0.32)');

/* ================= ENTITIES ================= */
function newEnt(kind,r,x){return {kind:kind,r:r,x:x,fr:r,fx:x,t:1,state:'idle',dirUp:false,dropY:0,fallY:0,fallV:0,timer:0,wait:0,hopDur:0.26,dead:false,flap:0};}
function makePlayer(id,animal,home,board,cpu){var p=newEnt('player',home.r,home.x);p.id=id;p.animal=animal;p.home=home;p.homeBoard=board;p.cpu=cpu;p.held=null;p.buf=null;p.inv=0;p.curse=0;p.score=0;p.lives=3;p.cpuWait=0.5;return p;}
function startHop(e,dir){var d=DIRS[dir];e.fr=e.r;e.fx=e.x;e.r+=d[0];e.x+=d[1];e.t=0;e.state='hop';e.dirUp=d[0]<0;}
function startDrop(e){e.state='drop';e.dropY=-Math.max(H*0.5,CW*5);e.fr=e.r;e.fx=e.x;}
function stepMotion(e,dt){
 if(e.state==='hop'){e.t+=dt/e.hopDur;if(e.t>=1){e.t=1;return 'land';}}
 else if(e.state==='drop'){e.dropY+=dt*CW*18;if(e.dropY>=0){e.dropY=0;return 'land';}}
 else if(e.state==='fall'){e.fallV+=dt*CW*30;e.fallY+=e.fallV*dt;e.timer+=dt;if(e.timer>1.1)return 'fallen';}
 return null;
}
function entPos(e){
 if(e.kind==='parrot'){var bob=e.state==='perch'?0:Math.sin(e.flap)*CW*0.06;return {x:sx(e.gx),y:sy(e.gy)-CW*0.28-bob,lift:CW*0.28+bob};}
 if(e.state==='hop'){var k=e.t,x0=sx(e.fx),y0=sy(e.fr),x1=sx(e.x),y1=sy(e.r);var lift=Math.sin(Math.PI*k)*CW*(e.dirUp?0.6:0.38);return {x:x0+(x1-x0)*k,y:y0+(y1-y0)*k-lift,lift:lift};}
 if(e.state==='fall')return {x:sx(e.x),y:sy(e.r)+e.fallY,lift:0};
 if(e.state==='drop')return {x:sx(e.x),y:sy(e.r)+e.dropY,lift:-e.dropY};
 if(e.state==='ride')return {x:e.rx,y:e.ry,lift:CW};
 return {x:sx(e.x),y:sy(e.r),lift:0};
}
function dirKey(dr,dx){return dr<0?(dx>0?'UR':'UL'):(dx>0?'DR':'DL');}
function addScore(p,n){if(p)p.score+=n;}
function floatText(r,x,text,color){floats.push({r:r,x:x,text:text,color:color,t:0});}
function setBanner(text,sub,color,dur){banner={text:text,sub:sub,color:color,t:dur,max:dur};}

/* ---------- players ---------- */
function updPlayer(p,dt){
 if(p.inv>0)p.inv-=dt;if(p.curse>0)p.curse-=dt;
 if(p.state==='idle'){
  if(PHASE==='run'){
   if(p.cpu)cpuThink(p,dt);
   else{var d=p.buf||p.held;if(d){p.buf=null;startHop(p,d);p.hopDur=0.26;sfx('hop');}}
  }
 }else if(p.state==='hit'){p.timer+=dt;if(p.timer>1.2)afterHit(p);}
 else if(p.state==='ride'){updRide(p,dt);}
 else{
  var wasDrop=p.state==='drop';var res=stepMotion(p,dt);
  if(res==='land')playerLand(p,wasDrop);else if(res==='fallen')afterFall(p);
 }
}
function playerLand(p,wasDrop){
 if(wasDrop){p.state='idle';return;}
 var c=getCube(p.r,p.x);
 if(c){p.state='idle';paint(p,c);return;}
 var pz=pizzaAt(p.r,p.x);
 if(pz){boardPizza(p,pz);return;}
 p.state='fall';p.fallY=0;p.fallV=-CW*2;p.timer=0;sfx('fall');
}
function paint(p,c){
 if(MODE==='pyramid'){
  if(c.owner!==p.id){c.owner=p.id;c.flash=1;addScore(p,25);sfx('flip');checkPyramidClear(p);}
  return;
 }
 if(c.locked)return;
 if(c.owner===p.id){
  if(showdown){c.locked=true;c.flash=1;addScore(p,50);floatText(c.r,c.x,'LOCK',PCOL[p.id]);sfx('lock');}
  return;
 }
 var stolen=c.owner!==0;
 c.owner=p.id;c.flash=1;addScore(p,stolen?40:25);sfx('flip');
 if(stolen)floatText(c.r,c.x,'STEAL',PCOL[p.id]);
 if(!showdown)checkFill(p);
}
function checkFill(p){
 for(var i=0;i<cubeList.length;i++){var c=cubeList[i];if(c.board===p.homeBoard&&c.owner!==p.id)return;}
 startShowdown(p);
}
function startShowdown(p){
 showdown=true;timeLeft=90;SPEED=1.15;
 for(var i=0;i<cubeList.length;i++){if(cubeList[i].hidden)cubeList[i].hidden=false;}
 var nm=ANIMALS[p.animal].name.toUpperCase();
 setBanner('BRIDGE OPEN!',nm+' FILLED FIRST. 90 SECONDS. HOP TWICE TO LOCK.',PCOL[p.id],3.2);
 sfx('bridge');
}
function checkPyramidClear(p){
 for(var i=0;i<cubeList.length;i++){if(cubeList[i].owner!==p.id)return;}
 PHASE='clear';phaseT=0;addScore(p,1000);setBanner('BOARD CLEAR!','+1000','#3cff8a',2);sfx('clear');
}
function nextLevel(){
 level++;styleIdx++;SPEED=1+(level-1)*0.15;
 for(var i=0;i<cubeList.length;i++){cubeList[i].owner=0;cubeList[i].locked=false;}
 for(i=0;i<pizzas.length;i++)pizzas[i].used=false;
 enemies=[];spawnT=3;gameT=0;
 var p=players[0];p.r=0;p.x=0;startDrop(p);
 PHASE='ready';phaseT=0;setBanner('LEVEL '+level,'',PCOL[1],1.6);
}
function afterFall(p){
 if(MODE==='pyramid'){p.lives--;if(p.lives<0){endGame();return;}}
 respawn(p);
}
function respawn(p){p.r=p.home.r;p.x=p.home.x;startDrop(p);p.inv=1.6;}
function hitPlayer(p){
 p.state='hit';p.timer=0;p.curse=1.3;sfx('hit');
 if(MODE==='pyramid')freezeT=1.3;
}
function afterHit(p){
 if(MODE==='pyramid'){
  p.lives--;if(p.lives<0){endGame();return;}
  enemies=[];p.state='idle';p.inv=1.5;spawnT=2.5;
 }else respawn(p);
}
function boardPizza(p,pz){
 pz.used=true;p.state='ride';p.ride={t:0,pz:pz,b:boards[pz.b]};p.inv=0;
 p.rx=sx(pz.x);p.ry=sy(pz.r);sfx('pizza');floatText(pz.r,pz.x,'PIZZA!','#ffd23f');
 for(var i=0;i<enemies.length;i++){var e=enemies[i];
  if(e.kind==='keeper'&&!e.dead&&(e.state==='idle'||e.state==='hop')&&Math.abs(e.r-pz.r)===1&&Math.abs(e.x-pz.x)===1)e.lure={r:pz.r,x:pz.x,by:p};}
}
function updRide(p,dt){
 var R=p.ride;R.t+=dt/1.5;
 var x0=sx(R.pz.x),y0=sy(R.pz.r),x1=sx(R.b.ax),y1=sy(0);
 if(R.t<0.15){p.rx=x0;p.ry=y0-CW*0.1;}
 else{
  var u=(R.t-0.15)/0.85;u=u<0?0:(u>1?1:u);var e=u*u*(3-2*u);
  var cxm=(x0+x1)/2,cym=Math.min(y0,y1)-CW*2.4;
  var a=(1-e)*(1-e),b=2*(1-e)*e,c=e*e;
  p.rx=a*x0+b*cxm+c*x1;p.ry=a*y0+b*cym+c*y1-CW*0.1;
 }
 if(R.t>=1){
  p.r=0;p.x=R.b.ax;p.fr=p.r;p.fx=p.x;p.state='idle';p.inv=0.6;p.ride=null;
  var cb=getCube(p.r,p.x);if(cb)paint(p,cb);
 }
}

/* ---------- CPU ---------- */
function cpuWant(p,c){if(!c||c.locked)return 0;if(c.owner!==p.id)return 2;if(showdown)return 1;return 0;}
function cpuBFS(p,blocked){
 var seen={};seen[p.r+','+p.x]=1;var q=[{r:p.r,x:p.x,first:null,d:0}],qi=0,best1=null,k;
 while(qi<q.length){
  var n=q[qi++];
  if(n.d>0){var w=cpuWant(p,getCube(n.r,n.x));if(w===2)return n.first;if(w===1&&!best1)best1=n;if(best1&&n.d>best1.d+3)return best1.first;}
  for(k in DIRS){var d=DIRS[k],nr=n.r+d[0],nx=n.x+d[1],key=nr+','+nx;
   if(seen[key]||!getCube(nr,nx))continue;if(blocked[key]&&n.d<2)continue;
   seen[key]=1;q.push({r:nr,x:nx,first:n.first||k,d:n.d+1});}
 }
 return best1?best1.first:null;
}
function cpuThink(p,dt){
 p.cpuWait-=dt;if(p.cpuWait>0)return;p.cpuWait=rnd(0.1,0.3);
 var blocked={},i,k,d,kNear=false;
 for(i=0;i<enemies.length;i++){var e=enemies[i];if(e.dead||e.kind==='parrot'||e.state==='fall')continue;
  blocked[e.r+','+e.x]=1;if(e.state==='hop')blocked[e.fr+','+e.fx]=1;
  if(e.kind==='roo'){blocked[(e.r+1)+','+(e.x-1)]=1;blocked[(e.r+1)+','+(e.x+1)]=1;}
  if(e.kind==='keeper'){for(k in DIRS){d=DIRS[k];blocked[(e.r+d[0])+','+(e.x+d[1])]=1;}
   if(Math.max(Math.abs(e.r-p.r),Math.abs(e.x-p.x))<=2)kNear=true;}}
 if(kNear){for(k in DIRS){d=DIRS[k];if(pizzaAt(p.r+d[0],p.x+d[1])){startHop(p,k);sfx('hop');return;}}}
 var dir=Math.random()<0.1?null:cpuBFS(p,blocked);
 if(!dir){var opts=[];for(k in DIRS){d=DIRS[k];if(getCube(p.r+d[0],p.x+d[1])&&!blocked[(p.r+d[0])+','+(p.x+d[1])])opts.push(k);}
  if(!opts.length){for(k in DIRS){d=DIRS[k];if(getCube(p.r+d[0],p.x+d[1]))opts.push(k);}}
  if(opts.length)dir=pick(opts);}
 if(dir){startHop(p,dir);p.hopDur=0.28;}
}

/* ---------- enemies ---------- */
function liveCount(kind){var n=0;for(var i=0;i<enemies.length;i++)if(!enemies[i].dead&&enemies[i].kind===kind)n++;return n;}
function spawnEnemy(){
 var opts=[],kCap=MODE==='pyramid'?1:2,rCap=MODE==='pyramid'?2:3;
 if(liveCount('keeper')<kCap&&gameT>6)opts.push('keeper','keeper');
 if(liveCount('roo')<rCap)opts.push('roo','roo','roo');
 if(liveCount('parrot')<1&&gameT>4)opts.push('parrot');
 if(!opts.length)return;
 var kind=pick(opts),bids=MODE==='pyramid'?['A']:['A','B'],b=pick(bids),ax=boards[b].ax,e,i;
 if(kind==='parrot'){spawnParrot();return;}
 if(kind==='keeper'){
  var cnt={A:0,B:0};for(i=0;i<enemies.length;i++){if(enemies[i].kind==='keeper'&&!enemies[i].dead)cnt[enemies[i].board]=(cnt[enemies[i].board]||0)+1;}
  if(MODE!=='pyramid'){b=cnt.A<=cnt.B?'A':'B';ax=boards[b].ax;}
  for(i=0;i<players.length;i++){var p=players[i];if(p.r<=1&&Math.abs(p.x-ax)<=1)return;}
  e=newEnt('keeper',0,ax);e.board=b;e.wait=0.6;
 }else{e=newEnt('roo',1,ax+pick([-1,1]));e.board=b;e.wait=0.3;}
 startDrop(e);enemies.push(e);
}
function spawnParrot(){
 var minX=1e9,maxX=-1e9;for(var i=0;i<cubeList.length;i++){if(cubeList[i].x<minX)minX=cubeList[i].x;if(cubeList[i].x>maxX)maxX=cubeList[i].x;}
 var e=newEnt('parrot',0,0);e.gx=Math.random()<0.5?minX-4:maxX+4;e.gy=-1.5;e.state='fly';e.swaps=0;parrotPick(e);enemies.push(e);sfx('squawk');
}
function parrotPick(e){
 var c=[],i;for(i=0;i<cubeList.length;i++){var q=cubeList[i];if(!q.hidden&&!q.locked&&q.owner)c.push(q);}
 if(!c.length){for(i=0;i<cubeList.length;i++)if(!cubeList[i].hidden)c.push(cubeList[i]);}
 e.target=pick(c);
}
function parrotSwap(c){
 if(!c||c.locked||c.hidden||!c.owner)return;
 if(MODE==='pyramid')c.owner=0;else c.owner=3-c.owner;
 c.flash=1;floatText(c.r,c.x,'SWAP!','#ff2a4a');sfx('squawk');
}
function updParrot(e,dt){
 e.flap+=dt*14;
 if(e.state==='fly'||e.state==='leave'){
  var tx=e.state==='leave'?e.lx:e.target.x,ty=e.state==='leave'?-5:e.target.r;
  var dx=tx-e.gx,dy=(ty-e.gy)*1.5,d=Math.sqrt(dx*dx+dy*dy),sp=(e.state==='leave'?10:5)*dt*SPEED;
  if(d<=sp){if(e.state==='leave'){e.dead=true;return;}e.gx=tx;e.gy=ty;e.state='perch';e.timer=0;}
  else{e.gx+=dx/d*sp;e.gy+=dy/1.5/d*sp;}
 }else if(e.state==='perch'){
  e.timer+=dt;
  if(e.timer>0.55){parrotSwap(e.target);e.swaps++;
   if(e.swaps>=4){e.state='leave';e.lx=e.gx+(Math.random()<0.5?-14:14);}else{parrotPick(e);e.state='fly';}}
 }
}
function keeperThink(e){
 var k,d;
 if(e.lure){startHop(e,dirKey(e.lure.r-e.r,e.lure.x-e.x));e.lureNow=true;return;}
 var tgt=null,best=1e9,eb=getCube(e.r,e.x);
 for(var i=0;i<players.length;i++){var p=players[i];if(p.state!=='idle'&&p.state!=='hop')continue;
  var pc=getCube(p.r,p.x);if(!showdown&&pc&&eb&&pc.board!==eb.board)continue;
  var dd=Math.max(Math.abs(p.r-e.r),Math.abs(p.x-e.x));if(dd<best){best=dd;tgt=p;}}
 var opts=[];for(k in DIRS){d=DIRS[k];if(getCube(e.r+d[0],e.x+d[1]))opts.push(k);}
 if(!opts.length)return;
 if(!tgt){startHop(e,pick(opts));return;}
 var bk=opts[0],bd=1e9;
 for(var j=0;j<opts.length;j++){d=DIRS[opts[j]];var nr=e.r+d[0],nx=e.x+d[1];
  var v=Math.max(Math.abs(tgt.r-nr),Math.abs(tgt.x-nx))+0.1*(Math.abs(tgt.r-nr)+Math.abs(tgt.x-nx))+Math.random()*0.3;
  if(v<bd){bd=v;bk=opts[j];}}
 startHop(e,bk);
}
function updEnemy(e,dt){
 if(e.kind==='parrot'){updParrot(e,dt);return;}
 if(e.state==='idle'){
  e.wait-=dt;
  if(e.wait<=0){
   e.wait=(e.kind==='keeper'?0.5:0.42)/SPEED;e.hopDur=(e.kind==='keeper'?0.3:0.26)/Math.sqrt(SPEED);
   if(e.kind==='keeper')keeperThink(e);else startHop(e,pick(['DL','DR']));
  }
 }else{
  var res=stepMotion(e,dt);
  if(res==='land'){
   if(getCube(e.r,e.x)){e.state='idle';if(e.kind==='roo')sfx('boing');}
   else{e.state='fall';e.fallY=0;e.fallV=-CW;e.timer=0;
    if(e.lureNow&&e.lure){addScore(e.lure.by,500);floatText(e.r,e.x,'SPLAT +500','#3cff8a');sfx('splat');}}
  }else if(res==='fallen')e.dead=true;
 }
}
function collide(){
 for(var i=0;i<players.length;i++){
  var p=players[i];if(p.state==='hit'||p.state==='ride'||p.state==='fall'||p.state==='drop')continue;
  var pp=entPos(p);
  for(var j=0;j<enemies.length;j++){
   var e=enemies[j];if(e.dead)continue;var ep=entPos(e);
   if(e.kind==='parrot'){
    if(e.state==='leave')continue;
    var dx=pp.x-ep.x,dy=pp.y-ep.y;
    if(dx*dx+dy*dy<CW*CW*0.3){e.state='leave';e.lx=e.gx+(Math.random()<0.5?-14:14);addScore(p,100);floatText(p.r,p.x,'CAUGHT +100','#ffd23f');sfx('catch');}
    continue;
   }
   if(e.state==='fall'||e.state==='drop'||p.inv>0)continue;
   if(Math.abs(pp.x-ep.x)<CW*0.38&&Math.abs(pp.y-ep.y)<CW*0.3){hitPlayer(p);break;}
  }
 }
}

/* ================= GAME FLOW ================= */
function countOwner(id){var n=0;for(var i=0;i<cubeList.length;i++){var c=cubeList[i];if(!c.hidden&&c.owner===id)n++;}return n;}
function ownBoard(p){var n=0,t=0;for(var i=0;i<cubeList.length;i++){var c=cubeList[i];if(c.board===p.homeBoard){t++;if(c.owner===p.id)n++;}}return n+'/'+t;}
function startGame(){

 var html='',img=function(a,sz){return '<img alt="" src="'+SPR_URL[a]+'" style="width:'+sz+'px;height:'+sz+'px;image-rendering:pixelated;margin:0 6px">';};

  else{var w=c1>c2?a:b,col=PCOL[w.id],lbl=c1>c2?la:lb;
   html=img(w.animal,120)+'<h2 style="font-size:18px;color:'+col+';text-shadow:0 0 12px '+col+'">'+(lbl==='You'?'You win!':lbl+' wins!')+'</h2>';}

var KEYMAP1={KeyW:'UR',KeyD:'DR',KeyS:'DL',KeyA:'UL',Numpad9:'UR',Numpad3:'DR',Numpad1:'DL',Numpad7:'UL'};
var KEYMAP2={ArrowUp:'UR',ArrowRight:'DR',ArrowDown:'DL',ArrowLeft:'UL'};
var keys={};
function keyDir(m){for(var k in m){if(keys[k])return m[k];}return null;}
window.addEventListener('keydown',function(ev){
 var c=ev.code;
 if(KEYMAP1[c]||KEYMAP2[c])ev.preventDefault();
 if(!keys[c]&&SCREEN==='play'){
  var idx=-1,d=null;if(KEYMAP1[c]){idx=0;d=KEYMAP1[c];}else if(KEYMAP2[c]){idx=MODE==='2p'?1:0;d=KEYMAP2[c];}
  if(idx>=0&&players[idx]&&!players[idx].cpu)players[idx].buf=d;
 }
 keys[c]=true;
 if(c==='Escape'||c==='KeyP'){if(SCREEN==='play')pauseGame();else if(SCREEN==='pause')resumeGame();}
 if(c==='Enter'&&SCREEN==='over')startGame();
});
window.addEventListener('keyup',function(ev){keys[ev.code]=false;});
function gpPressed(g,n){return !!(g.buttons[n]&&g.buttons[n].pressed);}
var gpStartPrev=false;
function gpRead(){
 var out=[],gps=navigator.getGamepads?navigator.getGamepads():[];
 for(var i=0;i<gps.length;i++){var g=gps[i];if(!g)continue;var d=null;
  if(gpPressed(g,12))d='UR';else if(gpPressed(g,15))d='DR';else if(gpPressed(g,13))d='DL';else if(gpPressed(g,14))d='UL';
  else if(g.axes&&g.axes.length>=2){var ax=g.axes[0],ay=g.axes[1];
   if(ax*ax+ay*ay>0.35){if(Math.abs(ay)>=Math.abs(ax))d=ay<0?'UR':'DL';else d=ax>0?'DR':'UL';}}
  out.push({dir:d,start:gpPressed(g,9),a:gpPressed(g,0)});}
 return out;
}
function readInputs(gp){
 for(var i=0;i<players.length;i++){
  var p=players[i];if(p.cpu)continue;
  var d=padDir[i]||keyDir(i===0?KEYMAP1:KEYMAP2);
  if(!d&&i===0&&MODE!=='2p')d=keyDir(KEYMAP2);
  if(!d&&gp[i])d=gp[i].dir;
  if(d&&!p.held)p.buf=d;
  p.held=d;
 }
}
var ARMS={UR:'a-up',DR:'a-right',DL:'a-down',UL:'a-left'};
function setPad(i,d){
 padDir[i]=d;var pad=pads[i];var col=players[i]?PCOL[players[i].id]:'#ff3cf0';
 for(var k in ARMS){var arm=pad.querySelector('.'+ARMS[k]);arm.style.background=(k===d)?col:'#2b1660';arm.style.boxShadow=(k===d)?('0 0 12px '+col):'none';}
}
function makePad(i){
 var pad=document.createElement('div');pad.className='pad';pad.style.display='none';
 pad.innerHTML='<div class="cross"><div class="arm a-up"></div><div class="arm a-right"></div><div class="arm a-down"></div><div class="arm a-left"></div><div class="hub"></div></div>';
 document.body.appendChild(pad);var active=null;
 function upd(ev){var r=pad.getBoundingClientRect(),dx=ev.clientX-(r.left+r.width/2),dy=ev.clientY-(r.top+r.height/2);
  if(dx*dx+dy*dy<r.width*r.width*0.006){setPad(i,null);return;}
  setPad(i,dx>=0?(dy<0?'UR':'DR'):(dy>0?'DL':'UL'));}
 pad.addEventListener('pointerdown',function(ev){ev.preventDefault();audioInit();active=ev.pointerId;try{pad.setPointerCapture(ev.pointerId);}catch(e){}upd(ev);
  var p=players[i];if(p&&padDir[i]&&SCREEN==='play')p.buf=padDir[i];});
 pad.addEventListener('pointermove',function(ev){if(ev.pointerId!==active)return;ev.preventDefault();upd(ev);});
 function end(ev){if(ev.pointerId!==active)return;active=null;setPad(i,null);}
 pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
 return pad;
}
function layoutPads(){
 var P=padSize(),top=H-SAFE.b-P-14,i;
 for(i=0;i<2;i++){pads[i].style.width=P+'px';pads[i].style.height=P+'px';pads[i].style.top=top+'px';}
 var playing=SCREEN==='play';
 var show0=playing&&players[0]&&!players[0].cpu,show1=playing&&MODE==='2p';
 pads[0].style.display=show0?'block':'none';pads[1].style.display=show1?'block':'none';
 if(MODE==='2p'){pads[0].style.left=(SAFE.l+14)+'px';pads[1].style.left=(W-SAFE.r-P-14)+'px';}
 else if(bottomPads())pads[0].style.left=((W-P)/2)+'px';
 else pads[0].style.left=(SAFE.l+14)+'px';
 for(i=0;i<2;i++){var col=players[i]?PCOL[players[i].id]:'#ff3cf0';pads[i].style.borderColor=col;pads[i].style.boxShadow='0 0 18px '+col;}
 var pb=document.getElementById('pauseBtn');pb.style.left=(W-SAFE.r-50)+'px';pb.style.top=(SAFE.t+8)+'px';pb.style.display=playing?'block':'none';
}

/* ================= SCREENS ================= */
function showScreen(n){
 var ids=['menu','select','over','pause'];
 for(var i=0;i<ids.length;i++)document.getElementById(ids[i]).style.display=(ids[i]===n)?'flex':'none';
 SCREEN=n;if(n!=='play'){setPad(0,null);setPad(1,null);}
 layoutPads();
}
function pauseGame(){if(SCREEN==='play')showScreen('pause');}
function resumeGame(){if(SCREEN==='pause')showScreen('play');}
function renderSelect(){
 document.getElementById('selHead').textContent=(MODE==='2p'||selMode==='2p'?'Player '+pickStage:'Player 1')+', pick your animal';
 var box=document.getElementById('cards');box.innerHTML='';
 for(var i=0;i<ORDER.length;i++){(function(key){
  var b=document.createElement('button');b.className='card';var taken=picks.indexOf(key)>=0;
  b.style.borderColor=ANIMALS[key].color;b.style.boxShadow='0 0 12px '+ANIMALS[key].color;b.style.opacity=taken?'0.35':'1';
  b.innerHTML='<img alt="" src="'+SPR_URL[key]+'"><div class="nm" style="color:'+ANIMALS[key].color+'">'+ANIMALS[key].name+'</div>'+(taken?'<span class="who">P1</span>':'');
  b.addEventListener('click',function(){
   if(taken)return;audioInit();sfx('flip');picks.push(key);
   if(selMode==='2p'&&pickStage===1){pickStage=2;renderSelect();return;}
   if(selMode==='cpu'){var rest=[];for(var j=0;j<ORDER.length;j++)if(ORDER[j]!==key)rest.push(ORDER[j]);picks.push(pick(rest));}
   startGame();
  });
  box.appendChild(b);
 })(ORDER[i]);}
}
function showSelect(){picks=[];pickStage=1;renderSelect();showScreen('select');}

/* ================= RENDER ================= */
function txt(s,x,y,size,color,align,glow){
 ctx.font=size+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='top';ctx.fillStyle=color;
 if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}ctx.fillText(s,x,y);ctx.shadowBlur=0;
}
function diamond(x,y){ctx.beginPath();ctx.moveTo(x,y-CW/4);ctx.lineTo(x+CW/2,y);ctx.lineTo(x,y+CW/4);ctx.lineTo(x-CW/2,y);ctx.closePath();}
var RAINBOW=['#ff3cf0','#29f3ff','#ffd23f','#3cff8a'];
function drawCubes(){
 for(var i=0;i<cubeList.length;i++){
  var c=cubeList[i];if(c.hidden||c.appear<=0)continue;
  var img=cubeImg(cubeStyle(c),c.owner,c.locked),x=sx(c.x),y=sy(c.r),dy=0;
  if(c.appear<1){ctx.globalAlpha=c.appear;dy=(1-c.appear)*CW*1.2;}
  ctx.drawImage(img,x-CW/2-img.m,y-CW/4-img.m+dy,img.width/DPR,img.height/DPR);
  ctx.globalAlpha=1;
  if(PHASE==='clear'){ctx.globalAlpha=0.55;ctx.fillStyle=RAINBOW[(Math.floor(TIME*10)+c.r)%4];diamond(x,y);ctx.fill();ctx.globalAlpha=1;}
  else if(c.flash>0){ctx.globalAlpha=c.flash*0.75;ctx.fillStyle='#ffffff';diamond(x,y+dy);ctx.fill();ctx.globalAlpha=1;}
 }
}
function poly(p){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(var j=2;j<p.length;j+=2)ctx.lineTo(p[j],p[j+1]);ctx.closePath();}
function drawPizzaBox(x,y,i){
 var bob=Math.sin(TIME*3+i)*CW*0.06,w=CW*0.62,h=w*0.5,t=CW*0.1;
 ctx.fillStyle='rgba(255,210,63,'+(0.22+0.14*Math.sin(TIME*5+i)).toFixed(2)+')';CE(x,y+h*0.6+t+CW*0.12,w*0.55,w*0.18);ctx.fill();
 y-=CW*0.12-bob;
 poly([x-w/2,y,x,y+h/2,x,y+h/2+t,x-w/2,y+t]);ctx.fillStyle='#a8752e';ctx.fill();
 poly([x+w/2,y,x,y+h/2,x,y+h/2+t,x+w/2,y+t]);ctx.fillStyle='#8a5a1e';ctx.fill();
 poly([x,y-h/2,x+w/2,y,x,y+h/2,x-w/2,y]);ctx.fillStyle='#e0ac62';ctx.fill();
 ctx.lineWidth=1.5;ctx.strokeStyle='#fff3c4';ctx.stroke();
 ctx.fillStyle='#e8322f';CE(x,y,w*0.17,h*0.17);ctx.fill();
 ctx.fillStyle='#ffd23f';CE(x,y,w*0.07,h*0.07);ctx.fill();
}
var PEPS=[[-0.2,-0.05],[0.15,-0.1],[0.02,0.12],[-0.05,-0.22],[0.22,0.1]];
function drawPizzaOpen(x,y){
 var w=CW*0.86,h=w*0.5;
 ctx.fillStyle='rgba(255,239,154,0.35)';CE(x,y,w*0.62,h*0.62);ctx.fill();
 ctx.fillStyle='#d98a3a';CE(x,y,w/2,h/2);ctx.fill();
 ctx.fillStyle='#ffd23f';CE(x,y-1,w*0.42,h*0.42);ctx.fill();
 ctx.fillStyle='#d62828';
 for(var i=0;i<PEPS.length;i++){CE(x+PEPS[i][0]*w,y+PEPS[i][1]*w*0.5,w*0.06,h*0.06);ctx.fill();}
}
function drawPizzas(){for(var i=0;i<pizzas.length;i++){var p=pizzas[i];if(!p.used)drawPizzaBox(sx(p.x),sy(p.r),i);}}
function drawEnt(e){
 var pos=entPos(e),img=SPR_C[e.kind==='player'?e.animal:e.kind];
 var size=CW*(e.kind==='player'?0.84:(e.kind==='keeper'?0.9:(e.kind==='parrot'?0.7:0.8)));
 var gy=pos.y+pos.lift,sh;
 if(e.state!=='fall'&&e.state!=='ride'){
  sh=1-Math.min(0.6,Math.max(0,pos.lift)/(CW*1.5));
  ctx.fillStyle='rgba(0,0,0,0.45)';CE(pos.x,gy,CW*0.24*sh,CW*0.09*sh);ctx.fill();
  if(e.kind==='player'){ctx.strokeStyle=PCOL[e.id];ctx.lineWidth=2;CE(pos.x,gy,CW*0.28*sh,CW*0.1*sh);ctx.stroke();}
 }
 if(e.state==='ride')drawPizzaOpen(pos.x,pos.y+CW*0.04);
 if(e.kind==='player'&&e.inv>0&&e.state!=='ride'&&Math.floor(TIME*14)%2===0)return;
 var sc=1,sy2=1;
 if(e.state==='hop')sy2=1+0.12*Math.sin(Math.PI*e.t);
 if(e.state==='fall')sc=Math.max(0.15,1-e.timer*0.7);
 if(e.kind==='parrot')sy2=1+0.1*Math.sin(e.flap);
 ctx.save();ctx.translate(pos.x,pos.y+CW*0.07);ctx.scale(sc,sc*sy2);ctx.drawImage(img,-size/2,-size,size,size);ctx.restore();
 if(e.kind==='player'&&e.state!=='fall'){
  var my=pos.y-size-CW*0.06;ctx.fillStyle=PCOL[e.id];
  ctx.beginPath();ctx.moveTo(pos.x-CW*0.09,my-CW*0.12);ctx.lineTo(pos.x+CW*0.09,my-CW*0.12);ctx.lineTo(pos.x,my);ctx.closePath();ctx.fill();
  if(e.curse>0){
   var bw=CW*1.3,bh=CW*0.38,bx=pos.x+CW*0.12,by=my-CW*0.55;
   ctx.fillStyle='#ffffff';ctx.fillRect(bx,by,bw,bh);
   ctx.beginPath();ctx.moveTo(bx+4,by+bh);ctx.lineTo(bx+14,by+bh);ctx.lineTo(bx,by+bh+8);ctx.closePath();ctx.fill();
   txt('@!#?@!',bx+bw/2,by+bh*0.28,Math.max(7,Math.round(CW*0.16)),'#07021a','center');
  }
 }
}
function fmtTime(t){var s=Math.ceil(t),m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function drawHUD(){
 var y=SAFE.t+10,L=SAFE.l+12,R=W-SAFE.r-60;
 if(MODE==='pyramid'){
  var p=players[0];
  txt('SCORE',L,y,8,'#b9a6ff');txt(''+p.score,L,y+13,14,'#ffffff',null,8);
  txt('LEVEL '+level,W/2,y+6,10,'#ffd23f','center',10);
  for(var i=0;i<Math.max(0,p.lives);i++)ctx.drawImage(SPR_C[p.animal],R-20-i*24,y+2,20,20);
  return;
 }
 for(var j=0;j<2;j++){
  var q=players[j],left=j===0,x=left?L:R,col=PCOL[q.id];
  var nm=(q.cpu?'CPU ':'P'+(j+1)+' ')+nameOf(q).toUpperCase();
  var n=showdown?''+countOwner(q.id):ownBoard(q);
  ctx.drawImage(SPR_C[q.animal],left?x:x-26,y,26,26);
  txt(nm,left?x+32:x-32,y+1,8,col,left?'left':'right');
  txt(n,left?x+32:x-32,y+13,13,'#ffffff',left?'left':'right',8);
 }
 if(showdown){var hot=timeLeft<=10;var pulse=hot?(0.6+0.4*Math.abs(Math.sin(TIME*6))):1;
  ctx.globalAlpha=pulse;txt(fmtTime(timeLeft),W/2,y+2,16,hot?'#ff3c5a':'#ffffff','center',12);ctx.globalAlpha=1;
  txt('MOST CUBES WINS',W/2,y+24,7,'#b9a6ff','center');}
 else{txt('FILL YOUR BOARD',W/2,y+4,8,'#b9a6ff','center');txt('TO OPEN THE BRIDGE',W/2,y+16,8,'#b9a6ff','center');}
}
function drawBanners(){
 var cy=H*0.42;
 if(PHASE==='ready'){var s=phaseT<1.1?'READY?':'GO!';txt(s,W/2,cy,Math.round(Math.min(W,H)*0.08),'#ffd23f','center',18);}
 if(banner&&banner.t>0){
  ctx.globalAlpha=Math.min(1,banner.t*2);
  var sz=Math.round(Math.min(W,H)*0.07),pop=1+Math.max(0,(banner.t-banner.max+0.25))*1.5;
  ctx.save();ctx.translate(W/2,cy);ctx.scale(pop,pop);txt(banner.text,0,0,sz,banner.color,'center',18);ctx.restore();
  if(banner.sub)txt(banner.sub,W/2,cy+sz+12,Math.max(7,Math.round(sz*0.28)),'#ffffff','center',6);
  ctx.globalAlpha=1;
 }
 if(MODE!=='pyramid'&&H>W)txt('TURN SIDEWAYS FOR VERSUS',W/2,SAFE.t+52,8,'#29f3ff','center',8);
}
function drawGame(){
 var all=players.concat(enemies),i,list=[];
 for(i=0;i<all.length;i++){if(all[i].state==='fall'&&all[i].dirUp)drawEnt(all[i]);}
 drawCubes();drawPizzas();
 for(i=0;i<all.length;i++){if(!(all[i].state==='fall'&&all[i].dirUp))list.push({e:all[i],y:entPos(all[i]).y});}
 list.sort(function(a,b){return a.y-b.y;});
 for(i=0;i<list.length;i++)drawEnt(list[i].e);
 for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.max(0,1-f.t/1.2);
  txt(f.text,sx(f.x),sy(f.r)-CW*0.95-f.t*CW*0.8,Math.max(8,Math.round(CW*0.2)),f.color,'center',6);}
 ctx.globalAlpha=1;
 drawHUD();drawBanners();
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(bg)ctx.drawImage(bg,0,0,W,H);
 if((SCREEN==='play'||SCREEN==='pause'||SCREEN==='over')&&cubeList.length)drawGame();
}

/* ================= UPDATE ================= */
function update(dt){
 TIME+=dt;
 var gp=gpRead(),anyStart=false,i;
 for(i=0;i<gp.length;i++)if(gp[i].start)anyStart=true;
 if(anyStart&&!gpStartPrev){if(SCREEN==='play')pauseGame();else if(SCREEN==='pause')resumeGame();else if(SCREEN==='over')startGame();}
 gpStartPrev=anyStart;
 if(SCREEN!=='play')return;
 readInputs(gp);
 if(PHASE==='ready'){phaseT+=dt;if(phaseT>1.6)PHASE='run';}
 else if(PHASE==='clear'){phaseT+=dt;if(phaseT>2.2)nextLevel();}
 if(PHASE==='run'){
  gameT+=dt;
  if(showdown){var prev=Math.ceil(timeLeft);timeLeft-=dt;
   if(Math.ceil(timeLeft)!==prev&&timeLeft<=10&&timeLeft>0)sfx('tick');
   if(timeLeft<=0){timeLeft=0;endGame();return;}}
  if(freezeT>0)freezeT-=dt;
  else{spawnT-=dt;if(spawnT<=0){spawnT=rnd(3.2,5.5)/SPEED;spawnEnemy();}}
 }
 for(i=0;i<players.length;i++)updPlayer(players[i],dt);
 if(PHASE==='end')return;
 if(PHASE==='run'&&freezeT<=0){for(i=0;i<enemies.length;i++)updEnemy(enemies[i],dt);}
 var keep=[];for(i=0;i<enemies.length;i++)if(!enemies[i].dead)keep.push(enemies[i]);enemies=keep;
 if(PHASE==='run')collide();
 for(i=0;i<cubeList.length;i++){var c=cubeList[i];if(c.flash>0)c.flash=Math.max(0,c.flash-dt*3);if(!c.hidden&&c.appear<1)c.appear=Math.min(1,c.appear+dt*1.6);}
 var fk=[];for(i=0;i<floats.length;i++){floats[i].t+=dt;if(floats[i].t<1.2)fk.push(floats[i]);}floats=fk;
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
}
var last=0;
function loop(ts){var dt=last?(ts-last)/1000:0;last=ts;if(dt>0.05)dt=0.05;update(dt);render();requestAnimationFrame(loop);}

function resize(){
 W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;ctx.webkitImageSmoothingEnabled=false;
 var cs=window.getComputedStyle(document.getElementById('safe'));
 SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;
 buildBG();CUBE={};computeLayout();layoutPads();
}

/* ================= INIT ================= */
function init(){
 var k;for(k in SPR){SPR_C[k]=buildSprite(SPR[k]);SPR_URL[k]=bigSprite(SPR_C[k],6).toDataURL();}
 var lu=document.getElementById('lineup');
 for(var i=0;i<ORDER.length;i++){var im=document.createElement('img');im.alt=ANIMALS[ORDER[i]].name;im.src=SPR_URL[ORDER[i]];lu.appendChild(im);}
 pads=[makePad(0),makePad(1)];
 var mb=document.querySelectorAll('[data-mode]');
 for(i=0;i<mb.length;i++){mb[i].addEventListener('click',function(){audioInit();sfx('go');selMode=this.getAttribute('data-mode');MODE=selMode;showSelect();});}
 document.getElementById('selBack').addEventListener('click',function(){showScreen('menu');});
 document.getElementById('btnRematch').addEventListener('click',function(){startGame();});
 document.getElementById('btnAnimals').addEventListener('click',function(){MODE=selMode;showSelect();});
 document.getElementById('btnMenu').addEventListener('click',function(){showScreen('menu');});
 document.getElementById('btnResume').addEventListener('click',function(){resumeGame();});
 document.getElementById('btnQuit').addEventListener('click',function(){cubeList=[];showScreen('menu');});
 document.getElementById('pauseBtn').addEventListener('click',function(){pauseGame();});
 document.addEventListener('visibilitychange',function(){if(document.hidden)pauseGame();});
 window.addEventListener('resize',resize);
 window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
 document.addEventListener('gesturestart',function(e){e.preventDefault();});
 resize();showScreen('menu');requestAnimationFrame(loop);
}
init();
})();
</script>
