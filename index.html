<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07021a">
<title>Zooburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#07021a}
body{font-family:'Press Start 2P','Courier New',monospace;color:#f4ecff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);touch-action:none;-webkit-text-size-adjust:100%}
html.zoomed,html.zoomed body,html.zoomed canvas,html.zoomed .screen{touch-action:pinch-zoom pan-x pan-y}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.screen{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.dim{background:rgba(7,2,26,0.84)}
.title{font-size:clamp(30px,11vw,72px);letter-spacing:2px;margin:0 0 4px;line-height:1.1;font-weight:normal}
.title span{display:inline-block;text-shadow:0 0 6px currentColor,0 0 18px currentColor,3px 3px 0 #2a0a48}
.tag{font-size:10px;color:#b9a6ff;margin:10px 0 16px;line-height:1.8}
.lineup{display:flex;justify-content:center;margin:4px 0 14px}
.lineup img{width:56px;height:56px;margin:0 6px;image-rendering:pixelated;animation:bob 0.6s steps(2) infinite alternate}
.lineup img:nth-child(2){animation-delay:0.15s}
.lineup img:nth-child(3){animation-delay:0.3s}
.lineup img:nth-child(4){animation-delay:0.45s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.btn{font-family:inherit;font-size:12px;color:#fff;background:#160733;border:3px solid #29f3ff;box-shadow:0 0 12px #29f3ff,inset 0 0 10px rgba(41,243,255,0.35);border-radius:4px;padding:14px 16px;margin:7px;min-width:230px;cursor:pointer;line-height:1.5}
.btn small{display:block;font-size:8px;color:#b9a6ff;margin-top:6px}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
.btns{display:flex;flex-wrap:wrap;justify-content:center}
.hint{font-size:8px;color:#8f7fd0;line-height:2.1;max-width:520px;margin-top:14px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;max-width:640px;align-items:flex-start}
.card{font-family:inherit;color:#fff;background:#140832;border:3px solid #ffffff;border-radius:6px;padding:8px 6px;width:104px;margin:5px;cursor:pointer;position:relative;vertical-align:top}
.card img{width:72px;height:72px;image-rendering:pixelated;display:block;margin:0 auto 6px}
.card.locked{border-color:#3a2f66;box-shadow:none;cursor:default;background:#0e0526}
.card.locked .nm{color:#5a4a90}
.card .req{font-size:7px;line-height:1.6;color:#b9a6ff;margin-top:6px}
.card .req.prog{color:#ffd23f;margin-top:4px}
.card .new.nxt{background:#29f3ff;animation:none}
.card .new{position:absolute;top:6px;right:6px;font-size:7px;padding:3px 4px;background:#ffd23f;color:#07021a;animation:blink 0.8s steps(2) infinite}
.unl{display:flex;align-items:center;gap:12px;margin:10px auto 6px;padding:10px 14px;border:3px solid #fff;border-radius:6px;background:#140832;font-size:10px;line-height:1.8;text-align:left;max-width:300px}
.unl img{width:56px;height:56px;image-rendering:pixelated}
#toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:8px 14px;font-size:10px;color:#fff;background:#140832;border:3px solid #fff;border-radius:6px;white-space:nowrap;pointer-events:none}
#toast img{width:32px;height:32px;image-rendering:pixelated}
.card .nm{font-size:10px}
.card .who{position:absolute;top:6px;left:6px;font-size:8px;padding:3px 4px;background:#ffffff;color:#07021a}
h2{font-size:13px;margin:0 0 16px;line-height:1.7;font-weight:normal}
#pauseBtn{position:fixed;z-index:6;width:40px;height:40px;font-family:inherit;font-size:11px;color:#fff;background:#160733;border:2px solid #ff3cf0;border-radius:4px;box-shadow:0 0 10px #ff3cf0;padding:0}
.pad{position:fixed;z-index:5;border-radius:50%;background:#12062e;border:3px solid #ff3cf0;opacity:0.9;touch-action:none}
.cross{position:absolute;left:13%;top:13%;width:74%;height:74%;transform:rotate(45deg);-webkit-transform:rotate(45deg);pointer-events:none}
.arm{position:absolute;width:34%;height:34%;background:#2b1660;border:2px solid #8a6cff;border-radius:6px}
.a-up{left:33%;top:0}.a-down{left:33%;bottom:0}.a-left{left:0;top:33%}.a-right{right:0;top:33%}
.hub{position:absolute;left:33%;top:33%;width:34%;height:34%;background:#2b1660}
.arm:after{content:'';position:absolute;left:50%;top:50%;width:0;height:0;border:6px solid transparent}
.a-up:after{border-bottom-color:#ffffff;margin:-12px 0 0 -6px}
.a-down:after{border-top-color:#ffffff;margin:0 0 0 -6px}
.a-left:after{border-right-color:#ffffff;margin:-6px 0 0 -12px}
.a-right:after{border-left-color:#ffffff;margin:-6px 0 0 0}
#menu{padding-top:calc(env(safe-area-inset-top,0px) + 62px)}
#cogBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:44px;height:44px;padding:6px;background:#160733;border:2px solid #29f3ff;border-radius:4px;box-shadow:0 0 10px #29f3ff;cursor:pointer;color:#29f3ff}
#cogBtn svg{width:100%;height:100%;display:block}
.setbox{width:100%;max-width:300px;margin:0 auto 10px;text-align:left}
.setrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.setlbl{font-size:11px}
.tog{font-family:inherit;font-size:10px;width:64px;padding:8px 0;color:#07021a;background:#3cff8a;border:2px solid #3cff8a;border-radius:4px;box-shadow:0 0 8px #3cff8a;cursor:pointer}
.tog[aria-pressed="false"]{color:#b9a6ff;background:#160733;border-color:#5a4a90;box-shadow:none}
.volrow{display:flex;align-items:center;gap:10px}
.volrow input{flex:1;min-width:0;height:32px;accent-color:#29f3ff;touch-action:none;margin:0}
.volrow input:disabled{opacity:0.4}
.volrow span{font-size:9px;width:40px;text-align:right;color:#b9a6ff}
.snd-hint{font-size:9px;color:#ffd23f;margin:-6px 0 10px;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0.25}}
@media (prefers-reduced-motion: reduce){.snd-hint{animation:none}.lineup img{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>

<div id="menu" class="screen" style="display:none">
  <button id="cogBtn" aria-label="Sound settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10 1h4l.6 3.1 1.9.8 2.6-1.8 2.8 2.8-1.8 2.6.8 1.9L23 10v4l-3.1.6-.8 1.9 1.8 2.6-2.8 2.8-2.6-1.8-1.9.8L14 23h-4l-.6-3.1-1.9-.8-2.6 1.8-2.8-2.8 1.8-2.6-.8-1.9L1 14v-4l3.1-.6.8-1.9-1.8-2.6 2.8-2.8 2.6 1.8 1.9-.8zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></button>
  <h1 class="title" aria-label="Zooburg"><span style="color:#ff3cf0">Z</span><span style="color:#ffd23f">O</span><span style="color:#29f3ff">O</span><span style="color:#3cff8a">B</span><span style="color:#ff9a1f">U</span><span style="color:#c46bff">R</span><span style="color:#ff3cf0">G</span></h1>
  <div class="tag">Hop the cubes. Paint the zoo. Steal the bridge.</div>
  <div id="sndHint" class="snd-hint" style="visibility:hidden">Tap anywhere for sound</div>
  <div class="lineup" id="lineup"></div>
  <div class="btns">
    <button class="btn" data-mode="pyramid" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">Classic pyramid<small>1 player, portrait</small></button>
    <button class="btn" data-mode="cpu">Versus CPU<small>1 player, landscape</small></button>
    <button class="btn" data-mode="cpux" style="border-color:#3cff8a;box-shadow:0 0 12px #3cff8a">Vs. CPU experimental<small>1 player, portrait</small></button>
    <button class="btn" data-mode="2p" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">2 players<small>Same phone or 2 controllers</small></button>
  </div>
  <div class="hint">The D-pad is turned 45&deg; like the arcade stick, so up hops up-right. Pizza boxes fly you back to the top. Keyboard: WASD and arrow keys.</div>
</div>

<div id="select" class="screen" style="display:none">
  <h2 id="selHead"></h2>
  <div class="cards" id="cards"></div>
  <div class="btns"><button class="btn" id="selBack" style="min-width:140px">Back</button></div>
</div>

<div id="over" class="screen dim" style="display:none">
  <div id="overBody"></div>
  <div class="btns">
    <button class="btn" id="btnRematch" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">Rematch</button>
    <button class="btn" id="btnAnimals">Change animals</button>
    <button class="btn" id="btnMenu" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">Main menu</button>
  </div>
</div>

<div id="pause" class="screen dim" style="display:none">
  <h2>Paused</h2>
  <div class="btns">
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn" id="btnSettings" style="border-color:#ffd23f;box-shadow:0 0 12px #ffd23f">Sound settings</button>
    <button class="btn" id="btnQuit" style="border-color:#ff3cf0;box-shadow:0 0 12px #ff3cf0">Main menu</button>
  </div>
</div>

<div id="settings" class="screen dim" style="display:none">
  <h2>Sound settings</h2>
  <div class="setbox">
    <div class="setrow"><span class="setlbl" id="lblMusic">Music</span><button class="tog" id="togMusic" aria-labelledby="lblMusic">ON</button></div>
    <div class="volrow"><input type="range" id="volMusic" min="0" max="100" step="5" aria-label="Music volume"><span id="valMusic"></span></div>
    <div class="setrow"><span class="setlbl" id="lblSfx">Sound FX</span><button class="tog" id="togSfx" aria-labelledby="lblSfx">ON</button></div>
    <div class="volrow"><input type="range" id="volSfx" min="0" max="100" step="5" aria-label="Sound effects volume"><span id="valSfx"></span></div>
  </div>
  <div class="btns"><button class="btn" id="setBack">Back</button></div>
</div>

<div id="toast" role="status"></div>
<button id="pauseBtn" style="display:none" aria-label="Pause">II</button>

function setupYinYang(){
 var C=[[0,[0,2,4,6,8,10,12]],[1,[1,3,5,7,9,11]],[2,[10,12]],[3,[11,13]],[4,[12,14]],[5,[11,13]]],i,j,r,x;

 boards.A={id:'A',home:{r:10,x:14},keeper:[{r:5,x:1},{r:5,x:3}],spawn:[{r:5,x:1},{r:5,x:3},{r:6,x:0},{r:6,x:2}],fl:{r:9,a:3,b:13},gor:{gx:12.8,gy:6.9},

 boards.B={id:'B',home:{r:0,x:0},keeper:[{r:5,x:13},{r:5,x:11}],spawn:[{r:2,x:10},{r:2,x:12},{r:1,x:5},{r:1,x:7}],fl:{r:1,a:1,b:11},gor:{gx:1.2,gy:3.1}};
 pizzas.push({r:2,x:4,b:'B',used:false},{r:1,x:13,b:'B',used:false},{r:8,x:10,b:'A',used:false},{r:9,x:1,b:'A',used:false});

function padSize(){return Math.round(Math.max(110,Math.min(160,Math.min(W,H)*0.36)));}
function bottomPads(){return MODE==='pyramid'||MODE==='cpux'||H>W;}
function computeLayout(){
 if(!cubeList.length)return;
 var minX=1e9,maxX=-1e9,maxR=0,i,c;
 for(i=0;i<cubeList.length;i++){c=cubeList[i];if(c.x<minX)minX=c.x;if(c.x>maxX)maxX=c.x;if(c.r>maxR)maxR=c.r;}
 for(i=0;i<pizzas.length;i++){c=pizzas[i];if(c.x<minX)minX=c.x;if(c.x>maxX)maxX=c.x;}
 var P=padSize(),left=SAFE.l+8,right=W-SAFE.r-8,top=SAFE.t+46,bottom=H-SAFE.b-8;
 if(bottomPads())bottom-=P+18;else{left+=P*0.45+12;right-=P*0.45+12;}
 var aw=right-left,ah=bottom-top,spanW=(maxX-minX)/2+1,spanH=1.65+0.75*maxR;
 CW=Math.max(16,Math.floor(Math.min(aw/spanW,ah/spanH,96)));
 OX=left+(aw-spanW*CW)/2+CW/2-minX*CW/2;
 OY=top+(ah-spanH*CW)/2+0.9*CW;
}

/* pre-rendered neon cubes */
function cubeImg(style,owner,prog,locked){
 var key=style+'|'+owner+'|'+prog+'|'+NEED+'|'+(locked?1:0);
 if(CUBE[key])return CUBE[key];
 var m=Math.ceil(CW*0.16),w=CW,h=CW/2,s=CW/2;
 var c=document.createElement('canvas');c.width=Math.ceil((w+2*m)*DPR);c.height=Math.ceil((h+s+2*m)*DPR);
 var g=c.getContext('2d');g.scale(DPR,DPR);
 var cx=m+w/2,t=m,st=STYLES[style],yy,k;
 function poly(p){g.beginPath();g.moveTo(p[0],p[1]);for(var j=2;j<p.length;j+=2)g.lineTo(p[j],p[j+1]);g.closePath();}
 var TOP=[cx,t,cx+w/2,t+h/2,cx,t+h,cx-w/2,t+h/2];
 var LF=[cx-w/2,t+h/2,cx,t+h,cx,t+h+s,cx-w/2,t+h/2+s];
 var RF=[cx+w/2,t+h/2,cx,t+h,cx,t+h+s,cx+w/2,t+h/2+s];
 poly(LF);g.fillStyle=st.l;g.fill();
 poly(RF);g.fillStyle=st.r;g.fill();
 g.save();poly(LF);g.clip();g.fillStyle='rgba(255,255,255,0.07)';for(yy=t;yy<t+h+s;yy+=4)g.fillRect(cx-w/2,yy,w/2,1);g.restore();
 g.save();poly(RF);g.clip();g.fillStyle='rgba(0,0,0,0.18)';for(yy=t+2;yy<t+h+s;yy+=4)g.fillRect(cx,yy,w/2,1);g.restore();
 var fin=owner&&prog>=NEED,top=stageColor(owner,prog);
 poly(TOP);g.fillStyle=top;g.fill();
 k=0.56;poly([cx,t+h*(1-k)/2,cx+w/2*k,t+h/2,cx,t+h-h*(1-k)/2,cx-w/2*k,t+h/2]);
 g.fillStyle=fin?mix(top,'#ffffff',0.35):'#272d7c';g.fill();
 if(owner&&!fin){g.fillStyle=top;for(var d=0;d<prog;d++){g.fillRect(cx-3+(d-(prog-1)/2)*7,t+h/2-1.5,3,3);}}
 if(locked){k=0.28;poly([cx,t+h*(1-k)/2,cx+w/2*k,t+h/2,cx,t+h-h*(1-k)/2,cx-w/2*k,t+h/2]);g.fillStyle='#ffffff';g.fill();}
 g.lineJoin='round';g.lineWidth=Math.max(1.5,CW/26);
 g.strokeStyle=locked?'#ffffff':st.e;g.shadowColor=locked?top:st.e;g.shadowBlur=m*(locked?1.2:0.9);
 g.beginPath();g.moveTo(cx,t);g.lineTo(cx+w/2,t+h/2);g.lineTo(cx+w/2,t+h/2+s);g.lineTo(cx,t+h+s);g.lineTo(cx-w/2,t+h/2+s);g.lineTo(cx-w/2,t+h/2);g.closePath();g.stroke();
 g.beginPath();g.moveTo(cx-w/2,t+h/2);g.lineTo(cx,t+h);g.lineTo(cx+w/2,t+h/2);g.moveTo(cx,t+h);g.lineTo(cx,t+h+s);g.stroke();
 c.m=m;CUBE[key]=c;return c;
}

 bg=document.createElement('canvas');bg.width=Math.round(W*DPR);bg.height=Math.round(H*DPR);
 var g=bg.getContext('2d');g.scale(DPR,DPR);
 var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#07021a');gr.addColorStop(0.62,'#1a0838');gr.addColorStop(1,'#3a0d4f');
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 var seed=7;function sr(){seed=(seed*16807)%2147483647;return seed/2147483647;}
 for(var i=0;i<150;i++){g.globalAlpha=0.3+sr()*0.7;g.fillStyle=sr()<0.2?'#29f3ff':(sr()<0.15?'#ff3cf0':'#ffffff');var z=sr()<0.15?2:1;g.fillRect(Math.floor(sr()*W),Math.floor(sr()*H*0.72),z,z);}
 g.globalAlpha=1;
 var hy=H*0.74;

 g.fillStyle=hg;g.fillRect(0,hy-70,W,70);

/* ================= ENTITIES ================= */
function newEnt(kind,r,x){return {kind:kind,r:r,x:x,fr:r,fx:x,t:1,state:'idle',dirUp:false,dropY:0,fallY:0,fallV:0,timer:0,wait:0,hopDur:0.26,dead:false,flap:0,move:null,lastDir:'DL',stand:0};}
function makePlayer(id,animal,home,board,cpu){var p=newEnt('player',home.r,home.x);p.id=id;p.animal=animal;p.home=home;p.homeBoard=board;p.cpu=cpu;p.held=null;p.buf=null;p.inv=0;p.curse=0;p.score=0;p.lives=3;p.cpuWait=0.5;p.waitT=0;p.mudNext=false;p.dizzy=0;p.spin=0;return p;}
function hopEnt(e,dir,mult,move){var d=DIRS[dir];e.fr=e.r;e.fx=e.x;e.r+=d[0]*mult;e.x+=d[1]*mult;e.t=0;e.state='hop';e.dirUp=d[0]<0;e.lastDir=dir;e.move=move||null;e.stand=0;}
function startHop(e,dir){hopEnt(e,dir,1,null);}
function startDrop(e){e.state='drop';e.dropY=-Math.max(H*0.5,CW*5);e.fr=e.r;e.fx=e.x;e.move=null;}
function startFall(e){e.state='fall';e.fallY=0;e.fallV=-CW;e.timer=0;}
function stepMotion(e,dt){
 if(e.state==='hop'){e.t+=dt/e.hopDur;if(e.t>=1){e.t=1;return 'land';}}
 else if(e.state==='drop'){e.dropY+=dt*CW*18;if(e.dropY>=0){e.dropY=0;return 'land';}}
 else if(e.state==='fall'){e.fallV+=dt*CW*30;e.fallY+=e.fallV*dt;e.timer+=dt;if(e.timer>1.1)return 'fallen';}
 return null;
}
function entPos(e){
 if(e.kind==='parrot'){var bob=e.state==='perch'?0:Math.sin(e.flap)*CW*0.06;return {x:sx(e.gx),y:sy(e.gy)-CW*0.28-bob,lift:CW*0.28+bob};}
 if(e.kind==='gorilla')return {x:sx(e.gx),y:sy(e.gy)+e.dropY,lift:0};
 if(e.kind==='mole')return {x:sx(e.x),y:sy(e.r),lift:0};
 if(e.state==='hop'){
  var k=e.t,x0=sx(e.fx),y0=sy(e.fr),x1=sx(e.x),y1=sy(e.r);
  var amp=e.move==='slide'?0.06:(e.move==='tramp'?1.5:(e.move==='walk'?0.14:(e.dirUp?0.6:0.38)));
  var lift=Math.sin(Math.PI*k)*CW*amp;return {x:x0+(x1-x0)*k,y:y0+(y1-y0)*k-lift,lift:lift};
 }
 if(e.state==='fall')return {x:sx(e.x),y:sy(e.r)+e.fallY,lift:0};
 if(e.state==='drop')return {x:sx(e.x),y:sy(e.r)+e.dropY,lift:-e.dropY};
 if(e.state==='ride')return {x:e.rx,y:e.ry,lift:CW};
 return {x:sx(e.x),y:sy(e.r),lift:0};
}
function dirKey(dr,dx){return dr<0?(dx>0?'UR':'UL'):(dx>0?'DR':'DL');}
function addScore(p,n){if(p)p.score+=n;}
function floatText(r,x,text,color){floats.push({r:r,x:x,text:text,color:color,t:0});}
function setBanner(text,sub,color,dur){banner={text:text,sub:sub,color:color,t:dur,max:dur};}
function isFrozen(p){return stopT>0&&stopBy&&stopBy!==p&&(p.state==='idle'||p.state==='hop'||p.state==='hit');}

/* ---------- players ---------- */
function updPlayer(p,dt){
 if(p.inv>0)p.inv-=dt;if(p.curse>0)p.curse-=dt;if(p.spin>0)p.spin-=dt;if(p.dizzy>0)p.dizzy-=dt;
 if(isFrozen(p))return;
 if(p.waitT>0)p.waitT-=dt;
 if(p.state==='idle'){
  var c=getCube(p.r,p.x);
  if(!c){p.dirUp=false;startFall(p);p.fallV=0;sfx('fall');return;}
  if(PHASE==='run'){
   if(WOB>0){p.stand+=dt;var w=p.stand/WOB;if(w>c.wig)c.wig=w;if(p.stand>=WOB){dropCube(c);return;}}
   if(p.waitT<=0){
    if(p.cpu)cpuThink(p,dt);
    else{var d=p.buf||p.held;if(d){p.buf=null;startHop(p,d);p.hopDur=p.mudNext?0.45:0.26;p.mudNext=false;sfx('hop');}}
   }
  }
 }else if(p.state==='hit'){p.timer+=dt;if(p.timer>1.2)afterHit(p);}
 else if(p.state==='ride'){updRide(p,dt);}
 else{
  var wasDrop=p.state==='drop';var res=stepMotion(p,dt);
  if(res==='land')playerLand(p,wasDrop);else if(res==='fallen')afterFall(p);
 }
}
function dropCube(c){c.gone=true;c.goneT=0;c.wig=0;sfx('crumble');floatText(c.r,c.x,'WOBBLE!','#ff8a3c');}
function playerLand(p,wasDrop){
 if(wasDrop){p.state='idle';p.stand=0;return;}
 var mv=p.move;p.move=null;
 var c=getCube(p.r,p.x);
 if(c){
  p.state='idle';p.stand=0;paint(p,c);
  if(PHASE!=='run')return;
  if(c.peel){c.peel=false;floatText(c.r,c.x,'SLIP!','#ffd23f');sfx('slip');p.spin=0.45;hopEnt(p,pick(['DL','DR']),1,'slide');p.hopDur=0.18;return;}
  if(c.special==='ice'&&mv!=='tramp'){sfx('ice');hopEnt(p,p.lastDir,1,'slide');p.hopDur=0.17;return;}
  if(c.special==='tramp'){sfx('spring');hopEnt(p,p.lastDir,2,'tramp');p.hopDur=0.5;return;}
  if(c.special==='mud'){p.waitT=0.45;p.mudNext=true;sfx('mud');floatText(c.r,c.x,'MUD','#c98a4a');}
  return;
 }
 var pz=pizzaAt(p.r,p.x);
 if(pz){boardPizza(p,pz);return;}
 startFall(p);p.fallV=-CW*2;sfx('fall');
}
function paint(p,c){
 if(c.locked)return;
 if(c.owner===p.id&&c.prog>=NEED){
  if(MODE!=='pyramid'&&showdown){c.locked=true;c.flash=1;addScore(p,50);floatText(c.r,c.x,'LOCK',PCOL[p.id]);sfx('lock');return;}
  if(RULE==='back'){c.prog=NEED-1;if(c.prog<=0){c.prog=0;c.owner=0;}c.flash=1;floatText(c.r,c.x,'OOPS','#ff3c5a');sfx('undo');}
  else if(RULE==='wrap'){c.prog=0;c.owner=0;c.flash=1;floatText(c.r,c.x,'WRAP','#ff3c5a');sfx('undo');}
  return;
 }
 var stolen=c.owner!==0&&c.owner!==p.id;
 if(c.owner!==p.id){c.owner=p.id;c.prog=1;}else c.prog++;
 c.flash=1;
 if(stolen)floatText(c.r,c.x,'STEAL',PCOL[p.id]);
 if(c.prog>=NEED){c.prog=NEED;addScore(p,stolen?40:25);sfx('flip');
  if(MODE==='pyramid')checkPyramidClear(p);else if(!showdown)checkFill(p);}
 else{addScore(p,15);sfx('step');}
}
function done(c,id){return c.owner===id&&c.prog>=NEED;}
function checkFill(p){
 for(var i=0;i<cubeList.length;i++){var c=cubeList[i];if(c.board===p.homeBoard&&!done(c,p.id))return;}

}
function startShowdown(p){

 for(var i=0;i<cubeList.length;i++){var c=cubeList[i];if(c.hidden){c.hidden=false;c.appearDir=1;}}
 var nm=ANIMALS[p.animal].name.toUpperCase();
 setBanner('BRIDGE OPEN!',nm+' FILLED FIRST. HOP A FINISHED CUBE TO LOCK IT.',PCOL[p.id],3.2);
 sfx('bridge');
}
function checkPyramidClear(p){

 PHASE='clear';phaseT=0;addScore(p,500+250*level);setBanner('BOARD CLEAR!','+'+(500+250*level),'#3cff8a',2);sfx('clear');
}

 applyRules();ROSTER=buildRoster(boardNum);
 for(var i=0;i<cubeList.length;i++){resetCube(cubeList[i]);if(!cubeList[i].hidden){cubeList[i].appear=1;cubeList[i].appearDir=1;}}
 placeSpecials();
 for(i=0;i<pizzas.length;i++)pizzas[i].used=false;
 enemies=[];bananas=[];floats=[];spawnT=3;moleT=10;gameT=0;stopT=0;stopBy=null;freezeT=0;shakeT=0;
 PHASE='ready';phaseT=0;readyLen=round===1?2.6:1.8;
}
function nextBoard(){
 round++;if(round>3){round=1;level++;players[0].lives=Math.min(5,players[0].lives+1);}

function respawn(p){
 p.r=p.home.r;p.x=p.home.x;var hc=cubes[p.r+','+p.x];if(hc&&hc.gone){resetCube(hc);hc.appear=1;}

function hitPlayer(p){

function afterHit(p){
 if(MODE==='pyramid'){
  p.lives--;if(p.lives<0){endGame();return;}
  enemies=[];bananas=[];p.state='idle';p.stand=0;p.inv=1.5;spawnT=2.5;
 }else respawn(p);

function boardPizza(p,pz){
 var rivalPz=MODE!=='pyramid'&&showdown&&pz.b!==p.homeBoard;
 pz.used=true;p.state='ride';p.ride={t:0,pz:pz,b:boards[rivalPz?p.homeBoard:pz.b]};p.inv=0;p.pzGoal=null;

 p.rx=sx(pz.x);p.ry=sy(pz.r);sfx('pizza');floatText(pz.r,pz.x,'PIZZA!','#ffd23f');

/* ---------- CPU ---------- */
function cpuWant(p,c){if(!c||c.locked)return 0;if(!done(c,p.id))return 2;if(showdown)return 1;return 0;}
function cpuBFS(p,blocked,strict,goal){
 var seen={};seen[p.r+','+p.x]=1;var q=[{r:p.r,x:p.x,first:null,d:0}],qi=0,best1=null,k;
 while(qi<q.length){
  var n=q[qi++];
  if(n.d>0){
   if(goal&&n.r===goal.r&&n.x===goal.x)return n.first;
   var cc=getCube(n.r,n.x),w=cpuWant(p,cc);
   if(w===2&&!goal)return n.first;if(w===1&&!best1)best1=n;if(best1&&!goal&&n.d>best1.d+3)return best1.first;
   if(strict&&cc&&done(cc,p.id))continue;
  }
  for(k in DIRS){var d=DIRS[k],nr=n.r+d[0],nx=n.x+d[1],key=nr+','+nx;
   if(seen[key]||!getCube(nr,nx))continue;if(blocked[key]&&n.d<2)continue;
   seen[key]=1;q.push({r:nr,x:nx,first:n.first||k,d:n.d+1});}
 }
 return (best1&&!goal)?best1.first:null;
}
function cpuThink(p,dt){
 p.cpuWait-=dt;if(p.cpuWait>0)return;p.cpuWait=rnd(0.1,0.3);
 var blocked={},i,k,d,kNear=false,sloth=null;
 for(i=0;i<enemies.length;i++){var e=enemies[i];if(e.dead||e.state==='fall')continue;
  if(e.kind==='sloth'&&e.state==='idle'&&Math.max(Math.abs(e.r-p.r),Math.abs(e.x-p.x))<=4){sloth=e;continue;}
  if(e.kind==='parrot'||e.kind==='gorilla'||e.kind==='sloth'||e.kind==='mole')continue;
  if(e.hunt&&e.hunt!==p)continue;
  if(stopT>0&&stopBy===p)continue;
  blocked[e.r+','+e.x]=1;if(e.state==='hop')blocked[e.fr+','+e.fx]=1;
  if(e.kind==='roo'||e.kind==='elephant'){blocked[(e.r+1)+','+(e.x-1)]=1;blocked[(e.r+1)+','+(e.x+1)]=1;}
  if(e.kind==='flamingo'){blocked[e.r+','+(e.x+2*e.sd)]=1;}
  if(e.kind==='keeper'){for(k in DIRS){d=DIRS[k];blocked[(e.r+d[0])+','+(e.x+d[1])]=1;}
   if(Math.max(Math.abs(e.r-p.r),Math.abs(e.x-p.x))<=2)kNear=true;}}
 if(kNear){for(k in DIRS){d=DIRS[k];if(pizzaAt(p.r+d[0],p.x+d[1])){startHop(p,k);p.hopDur=0.28;return;}}}
 var dir=null;
 if(showdown&&MODE!=='pyramid'){
  for(k in DIRS){d=DIRS[k];var rp=pizzaAt(p.r+d[0],p.x+d[1]);if(rp&&rp.b!==p.homeBoard&&Math.random()<0.7){startHop(p,k);p.hopDur=0.28;return;}}
  if(!p.pzGoal&&Math.random()<0.05){var gl=[];for(i=0;i<pizzas.length;i++){var pz=pizzas[i];if(pz.used||pz.b===p.homeBoard)continue;
    for(k in DIRS){d=DIRS[k];if(getCube(pz.r-d[0],pz.x-d[1]))gl.push({r:pz.r-d[0],x:pz.x-d[1]});}}
   if(gl.length)p.pzGoal=pick(gl);}
  if(p.pzGoal){if(p.pzGoal.r===p.r&&p.pzGoal.x===p.x)p.pzGoal=null;else{dir=cpuBFS(p,blocked,false,p.pzGoal);if(!dir)p.pzGoal=null;}}
 }
 if(sloth)dir=cpuBFS(p,blocked,false,{r:sloth.r,x:sloth.x});
 var strict=RULE!=='normal'&&!showdown;
 if(!dir&&Math.random()>0.1){dir=cpuBFS(p,blocked,strict,null);if(!dir&&strict)dir=cpuBFS(p,blocked,false,null);}
 if(!dir){var opts=[];for(k in DIRS){d=DIRS[k];if(getCube(p.r+d[0],p.x+d[1])&&!blocked[(p.r+d[0])+','+(p.x+d[1])])opts.push(k);}
  if(!opts.length){for(k in DIRS){d=DIRS[k];if(getCube(p.r+d[0],p.x+d[1]))opts.push(k);}}
  if(opts.length)dir=pick(opts);}
 if(dir){startHop(p,dir);p.hopDur=p.mudNext?0.45:0.28;p.mudNext=false;}
}

  if(gpPressed(g,12))d='UR';else if(gpPressed(g,15))d='DR';else if(gpPressed(g,13))d='DL';else if(gpPressed(g,14))d='UL';

   if(ax*ax+ay*ay>0.35){if(Math.abs(ay)>=Math.abs(ax))d=ay<0?'UR':'DL';else d=ax>0?'DR':'UL';}}

  if(e.curse>0){
   var bw=CW*1.3,bh=CW*0.38,bx=px+CW*0.12,by=my-CW*0.55;
   ctx.fillStyle='#ffffff';ctx.fillRect(bx,by,bw,bh);
   ctx.beginPath();ctx.moveTo(bx+4,by+bh);ctx.lineTo(bx+14,by+bh);ctx.lineTo(bx,by+bh+8);ctx.closePath();ctx.fill();
   txt('@!#?@!',bx+bw/2,by+bh*0.28,Math.max(7,Math.round(CW*0.16)),'#07021a','center');
  }
 }
}
function drawBananas(){
 for(var i=0;i<bananas.length;i++){var b=bananas[i],k=b.t;
  var x=sx(b.gx)+(sx(b.c.x)-sx(b.gx))*k,y=sy(b.gy)+(sy(b.c.r)-sy(b.gy))*k-Math.sin(Math.PI*k)*CW*1.4;
  ctx.save();ctx.translate(x,y);ctx.rotate(TIME*14+i);ctx.strokeStyle='#ffd23f';ctx.lineWidth=Math.max(3,CW*0.1);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,0,CW*0.14,0.3,Math.PI-0.3);ctx.stroke();ctx.restore();}
}
function fmtTime(t){var s=Math.ceil(t),m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function drawSwatches(cx,y,owner){
 var n=NEED,gap=22,x0=cx-(n-1)*gap/2;
 for(var s=1;s<=n;s++){var x=x0+(s-1)*gap;ctx.fillStyle=stageColor(owner,s);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+8,y+5);ctx.lineTo(x,y+10);ctx.lineTo(x-8,y+5);ctx.closePath();ctx.fill();
  if(s===n){ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.stroke();}}
}
function drawHUD(){
 var y=SAFE.t+10,L=SAFE.l+12,R=W-SAFE.r-60;
 if(MODE==='pyramid'){
  var p=players[0];
  txt('SCORE',L,y,8,'#b9a6ff');txt(''+p.score,L,y+13,14,'#ffffff',null,8);
  txt('LV '+level+'  BOARD '+round,W/2,y,9,'#ffd23f','center',10);
  txt('CHANGE TO',W/2,y+15,7,'#b9a6ff','center');drawSwatches(W/2,y+27,1);
  for(var i=0;i<Math.max(0,p.lives);i++)ctx.drawImage(SPR_C[p.animal],R-20-i*24,y+2,20,20);
 }else{
  for(var j=0;j<2;j++){
   var q=players[j],left=j===0,x=left?L:R,col=PCOL[q.id];
   var nm=W<560?(q.cpu?'CPU':(isCpuMode(MODE)?'YOU':'P'+(j+1))):(q.cpu?'CPU ':'P'+(j+1)+' ')+nameOf(q).toUpperCase();
   var n=showdown?''+countOwner(q.id):ownBoard(q);
   ctx.drawImage(SPR_C[q.animal],left?x:x-26,y,26,26);
   txt(nm,left?x+32:x-32,y+1,8,col,left?'left':'right');
   txt(n,left?x+32:x-32,y+13,13,'#ffffff',left?'left':'right',8);
  }
  if(showdown){var hot=timeLeft<=10;var pulse=hot?(0.6+0.4*Math.abs(Math.sin(TIME*6))):1;
   ctx.globalAlpha=pulse;txt(fmtTime(timeLeft),W/2,y+2,16,hot?'#ff3c5a':'#ffffff','center',12);ctx.globalAlpha=1;
   txt('MOST CUBES WINS',W/2,y+24,7,'#b9a6ff','center');}
  else{txt('LV '+level+'  BOARD '+round,W/2,y+2,8,'#ffd23f','center',8);if(W>=560)txt('FILL YOUR BOARD',W/2,y+15,7,'#b9a6ff','center');}
 }
 if(stopT>0)txt('TIME STOP '+Math.ceil(stopT),W/2,y+(MODE==='pyramid'?42:34),8,'#7fe8ff','center',10);
}
function drawReady(){
 var cy=H*0.3,big=Math.round(Math.min(W,H)*0.06),i;
 ctx.globalAlpha=0.7;ctx.fillStyle='#07021a';ctx.fillRect(0,cy-16,W,big*5.4+60);ctx.globalAlpha=1;
 txt('LEVEL '+level+'  BOARD '+round,W/2,cy,big,'#ffd23f','center',14);
 txt(ruleText(),W/2,cy+big+14,Math.max(7,Math.round(big*0.3)),'#ffffff','center',4);
 var yy=cy+big+32;
 if(level>=3){txt('ICE SLIDES  MUD SLOWS  SPRINGS LAUNCH',W/2,yy,7,'#7fe8ff','center');yy+=14;}
 if(WOB>0){txt('STAND STILL '+WOB+'S AND YOUR CUBE DROPS',W/2,yy,7,'#ff8a3c','center');yy+=14;}
 var n=ROSTER.length,sz=Math.min(30,Math.floor((W-40)/(n*1.3))),gap=sz*1.3,x0=W/2-(n-1)*gap/2;
 yy+=6;
 for(i=0;i<n;i++){var k=ROSTER[i],x=x0+i*gap;ctx.drawImage(SPR_C[k],x-sz/2,yy,sz,sz);
  if(!seenKinds[k])txt('NEW',x,yy+sz+3,6,'#3cff8a','center',6);}
 txt(phaseT<readyLen-0.5?'READY?':'GO!',W/2,yy+sz+18,Math.max(10,Math.round(big*0.6)),'#ff3cf0','center',12);
}
function drawBanner(){
 if(!banner||banner.t<=0||PHASE==='ready')return;
 var cy=H*0.42;
 ctx.globalAlpha=Math.min(1,banner.t*2);
 var sz=Math.round(Math.min(W,H)*0.07),pop=1+Math.max(0,(banner.t-banner.max+0.25))*1.5;
 ctx.save();ctx.translate(W/2,cy);ctx.scale(pop,pop);txt(banner.text,0,0,sz,banner.color,'center',18);ctx.restore();
 if(banner.sub)txt(banner.sub,W/2,cy+sz+12,Math.max(7,Math.round(sz*0.26)),'#ffffff','center',6);
 ctx.globalAlpha=1;
}
function drawGame(){
 var all=players.concat(enemies),i,list=[];
 ctx.save();
 if(shakeT>0)ctx.translate(rnd(-1,1)*CW*0.12*shakeT*2,rnd(-1,1)*CW*0.12*shakeT*2);
 for(i=0;i<all.length;i++){if(all[i].state==='fall'&&all[i].dirUp)drawEnt(all[i]);}
 drawCubes();drawPizzas();
 for(i=0;i<all.length;i++){if(!(all[i].state==='fall'&&all[i].dirUp))list.push({e:all[i],y:entPos(all[i]).y});}
 list.sort(function(a,b){return a.y-b.y;});
 for(i=0;i<list.length;i++)drawEnt(list[i].e);
 drawBananas();
 for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.max(0,1-f.t/1.2);
  txt(f.text,sx(f.x),sy(f.r)-CW*0.95-f.t*CW*0.8,Math.max(8,Math.round(CW*0.2)),f.color,'center',6);}
 ctx.globalAlpha=1;
 ctx.restore();
 if(stopT>0){ctx.fillStyle='rgba(127,232,255,0.08)';ctx.fillRect(0,0,W,H);}
 drawHUD();
 if(PHASE==='ready')drawReady();
 drawBanner();
 if(MODE!=='pyramid'&&MODE!=='cpux'&&H>W)txt('TURN SIDEWAYS FOR VERSUS',W/2,SAFE.t+56,8,'#29f3ff','center',8);
 if(MODE==='cpux'&&W>H)txt('TURN UPRIGHT FOR THIS MODE',W/2,SAFE.t+56,8,'#29f3ff','center',8);
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(bg)ctx.drawImage(bg,0,0,W,H);
 if((SCREEN==='play'||SCREEN==='pause'||SCREEN==='over')&&cubeList.length)drawGame();
}

/* ================= UPDATE ================= */
function update(dt){
 TIME+=dt;
 var gp=gpRead(),anyStart=false,i;
 for(i=0;i<gp.length;i++)if(gp[i].start)anyStart=true;
 if(anyStart&&!gpStartPrev){if(SCREEN==='play')pauseGame();else if(SCREEN==='pause')resumeGame();else if(SCREEN==='over')doRematch();}
 gpStartPrev=anyStart;
 if(SCREEN!=='play')return;
 readInputs(gp);
 if(PHASE==='ready'){phaseT+=dt;if(phaseT>readyLen){PHASE='run';for(i=0;i<ROSTER.length;i++)seenKinds[ROSTER[i]]=1;}}
 else if(PHASE==='clear'){phaseT+=dt;if(phaseT>2.2){nextBoard();return;}}
 if(shakeT>0)shakeT-=dt;
 if(stopT>0){stopT-=dt;if(stopT<=0){stopT=0;stopBy=null;sfx('unfreeze');}}
 if(PHASE==='run'){
  gameT+=dt;
  if(showdown){var prev=Math.ceil(timeLeft);timeLeft-=dt;
   if(Math.ceil(timeLeft)!==prev&&timeLeft<=10&&timeLeft>0)sfx('tick');
   if(timeLeft<=0){timeLeft=0;endGame();return;}}
  if(freezeT>0)freezeT-=dt;
  else if(stopT<=0){spawnT-=dt;if(spawnT<=0){spawnT=rnd(3.2,5.5)/SPEED;spawnEnemy();}
   if(MODE!=='pyramid'){moleT-=dt;if(moleT<=0){moleT=rnd(13,17);spawnMole();}}}
 }
 for(i=0;i<cubeList.length;i++)cubeList[i].wig=0;
 for(i=0;i<players.length;i++)updPlayer(players[i],dt);
 if(PHASE==='end')return;
 if(PHASE==='run'&&freezeT<=0&&stopT<=0){
  for(i=0;i<enemies.length;i++)updEnemy(enemies[i],dt);
  var bk=[];for(i=0;i<bananas.length;i++){var b=bananas[i];b.t+=dt/0.7;if(b.t>=1){if(!b.c.gone){b.c.peel=true;b.c.peelT=20;if(MODE!=='pyramid')bananaHit(b.c);}}else bk.push(b);}bananas=bk;
 }
 var keep=[];for(i=0;i<enemies.length;i++)if(!enemies[i].dead)keep.push(enemies[i]);enemies=keep;
 if(PHASE==='run')collide();
 for(i=0;i<cubeList.length;i++){var c=cubeList[i];
  if(c.peel&&PHASE==='run'){c.peelT=(c.peelT||20)-dt;if(c.peelT<=0){c.peel=false;c.peelT=0;}}
  if(c.flash>0)c.flash=Math.max(0,c.flash-dt*3);
  if(c.gone){c.goneT+=dt;if(c.goneT>1.8){resetCube(c);c.appear=0;c.appearDir=-1;}}
  else if(!c.hidden&&c.appear<1)c.appear=Math.min(1,c.appear+dt*1.6);}
 var fk=[];for(i=0;i<floats.length;i++){floats[i].t+=dt;if(floats[i].t<1.2)fk.push(floats[i]);}floats=fk;
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
}
var last=0;
function loop(ts){var dt=last?(ts-last)/1000:0;last=ts;if(dt>0.05)dt=0.05;update(dt);render();requestAnimationFrame(loop);}

function resize(){
 W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;ctx.webkitImageSmoothingEnabled=false;
 var cs=window.getComputedStyle(document.getElementById('safe'));
 SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;
 buildBG();CUBE={};computeLayout();layoutPads();
}

/* ================= INIT ================= */
function init(){
 var k;for(k in SPR){SPR_C[k]=buildSprite(SPR[k]);SPR_URL[k]=bigSprite(SPR_C[k],6).toDataURL();}
 for(k in ANIMALS){var sil={pal:{},rows:SPR[k].rows};for(var pc in SPR[k].pal)sil.pal[pc]='#3a2f66';SIL_URL[k]=bigSprite(buildSprite(sil),6).toDataURL();}
 var lu=document.getElementById('lineup');
 for(var i=0;i<STARTERS.length;i++){var im=document.createElement('img');im.alt=ANIMALS[STARTERS[i]].name;im.src=SPR_URL[STARTERS[i]];lu.appendChild(im);}
 pads=[makePad(0),makePad(1)];
 var mb=document.querySelectorAll('[data-mode]');
 for(i=0;i<mb.length;i++){mb[i].addEventListener('click',function(){audioInit();sfx('go');selMode=this.getAttribute('data-mode');MODE=selMode;matchNum=0;pendingAdvance=false;seenKinds={};showSelect();});}
 document.getElementById('selBack').addEventListener('click',function(){showScreen('menu');});
 document.getElementById('btnRematch').addEventListener('click',function(){doRematch();});
 document.getElementById('btnAnimals').addEventListener('click',function(){MODE=selMode;pendingAdvance=selMode!=='pyramid';showSelect();});
 document.getElementById('btnMenu').addEventListener('click',function(){cubeList=[];showScreen('menu');});
 document.getElementById('btnResume').addEventListener('click',function(){resumeGame();});
 document.getElementById('btnQuit').addEventListener('click',function(){recordProgress();cubeList=[];showScreen('menu');});
 document.getElementById('pauseBtn').addEventListener('click',function(){pauseGame();});
 document.addEventListener('visibilitychange',function(){if(document.hidden){pauseGame();try{if(AC)AC.suspend();}catch(e){}}else{try{if(AC)AC.resume();}catch(e){}}});
 ['pointerdown','pointerup','touchstart','touchend','mousedown','click','keydown'].forEach(function(t){document.addEventListener(t,audioInit,true);});
 document.getElementById('cogBtn').addEventListener('click',function(){audioInit();openSettings();});
 document.getElementById('btnSettings').addEventListener('click',function(){openSettings();});
 document.getElementById('setBack').addEventListener('click',function(){closeSettings();});
 document.getElementById('togMusic').addEventListener('click',function(){SET.music=!SET.music;saveSet();syncSettings();applyVolumes();updSoundHint();});
 document.getElementById('togSfx').addEventListener('click',function(){SET.sfx=!SET.sfx;saveSet();syncSettings();applyVolumes();if(SET.sfx)sfx('flip');});
 document.getElementById('volMusic').addEventListener('input',function(){SET.mv=this.value/100;syncSettings();applyVolumes();});
 document.getElementById('volSfx').addEventListener('input',function(){SET.sv=this.value/100;syncSettings();applyVolumes();});
 document.getElementById('volMusic').addEventListener('change',saveSet);
 document.getElementById('volSfx').addEventListener('change',function(){saveSet();sfx('flip');});
 window.addEventListener('resize',resize);
 window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
 // Zoom handling: block pinch/double-tap zoom normally, but if the page does get
 // zoomed in (e.g. iOS double-tap), allow pinching back out to normal size.
 function isZoomed(){var vv=window.visualViewport;return !!(vv&&vv.scale>1.01);}
 function updZoom(){document.documentElement.classList.toggle('zoomed',isZoomed());}
 if(window.visualViewport){window.visualViewport.addEventListener('resize',updZoom);window.visualViewport.addEventListener('scroll',updZoom);}
 function blockGesture(e){if(!isZoomed())e.preventDefault();}
 document.addEventListener('gesturestart',blockGesture);
 document.addEventListener('gesturechange',blockGesture);
 document.addEventListener('touchmove',function(e){if(e.touches.length>1&&!isZoomed())e.preventDefault();},{passive:false});
 document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
 var lastTapEnd=0;
 document.addEventListener('touchend',function(e){var now=Date.now();var t=e.target;
  if(now-lastTapEnd<350&&e.changedTouches.length===1&&!(t&&t.closest&&t.closest('button,a,input,select,textarea,.pad')))e.preventDefault();
  lastTapEnd=now;},{passive:false});
 updZoom();
 resize();showScreen('menu');audioInit();requestAnimationFrame(loop);
}
init();
})();
</script>
